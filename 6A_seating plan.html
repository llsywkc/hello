<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>課室座位表 Seating Plan</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root {
    --primary: #1A48A0;
    --primary-light: #E8F0FB;
    --accent-red: #F1060B;
    --accent-yellow: #FFEE15;
    --accent-green: #4D9140;
    --wood: #C98A4B;
    --wood-dark: #8B5A2B;
    --border: #cbd9ee;
    --text-main: #1e2a4a;
    --text-sub: #5b6b8c;
    --bg: #eef4fd;
    --card-bg: #fff8ec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { position: relative; }
  body {
    font-family: -apple-system, "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: linear-gradient(180deg, #a9cdf0 0%, #cfe4f8 180px, var(--bg) 380px);
    margin: 0; padding: 20px; color: var(--text-main);
    overflow-x: hidden; min-height: 100vh;
  }
  .cloud { position: absolute; background: #ffffff; border-radius: 50px; opacity: 0.9; z-index: 0; pointer-events: none; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #ffffff; border-radius: 50%; }
  .cloud1 { width: 90px; height: 30px; top: 18px; left: 6%; }
  .cloud1::before { width: 45px; height: 45px; top: -20px; left: 8px; }
  .cloud1::after { width: 35px; height: 35px; top: -14px; left: 45px; }
  .cloud2 { width: 70px; height: 24px; top: 40px; left: 80%; }
  .cloud2::before { width: 34px; height: 34px; top: -15px; left: 6px; }
  .cloud2::after { width: 26px; height: 26px; top: -10px; left: 34px; }
  .cloud3 { width: 60px; height: 20px; top: 10px; left: 45%; }
  .cloud3::before { width: 28px; height: 28px; top: -13px; left: 4px; }
  .cloud3::after { width: 22px; height: 22px; top: -9px; left: 28px; }
  .star { position: absolute; color: var(--accent-yellow); font-size: 20px; z-index: 0; pointer-events: none; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15)); }
  .star1 { top: 62px; left: 15%; font-size: 16px; }
  .star2 { top: 75px; left: 68%; font-size: 22px; }
  .star3 { top: 95px; left: 40%; font-size: 14px; }
  .star4 { top: 25px; left: 92%; font-size: 18px; }
  .content { position: relative; z-index: 1; }
  h1 {
    text-align: center; color: var(--wood-dark); font-size: 22px; font-weight: 700;
    margin: 0 auto 4px auto; letter-spacing: 0.3px; width: 100%; display: block;
  }
  .title-wrap { display: flex; justify-content: center; align-items: center; width: 100%; margin-top: 10px; }
  #planTitle {
    cursor: pointer; display: inline-block; padding: 10px 28px; border-radius: 8px;
    background: linear-gradient(180deg, #E8B573, var(--wood)); border: 3px solid var(--wood-dark);
    box-shadow: 0 4px 0 var(--wood-dark), 0 6px 10px rgba(0,0,0,0.15);
    transition: transform 0.15s ease; text-align: center; position: relative;
  }
  #planTitle::before, #planTitle::after {
    content: ""; position: absolute; width: 8px; height: 8px; background: #5b3a1e;
    border-radius: 50%; top: 6px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.3);
  }
  #planTitle::before { left: 8px; }
  #planTitle::after { right: 8px; }
  #planTitle:hover { transform: scale(1.03) rotate(-0.5deg); }
  #titleInput {
    display: block; margin: 0 auto; text-align: center; font-size: 20px; font-weight: 700;
    color: var(--wood-dark); border: none; border-bottom: 3px solid var(--accent-red);
    border-radius: 0; padding: 8px 16px; outline: none; font-family: inherit; max-width: 90%; background: #fff8ec;
  }
  .toolbar { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 22px 0; flex-wrap: wrap; }
  .toolbar button, .toolbar select {
    padding: 8px 18px; border-radius: 6px; background: var(--card-bg); font-size: 13px; font-weight: 700;
    color: var(--text-main); cursor: pointer; transition: all 0.15s ease;
    box-shadow: 0 3px 0 var(--border), 0 4px 6px rgba(0,0,0,0.1); border: 2px solid var(--border);
  }
  .toolbar button:hover { transform: translateY(-1px); }
  .toolbar button.active {
    background: var(--accent-red); color: #fff; border-color: #b30000;
    box-shadow: 0 3px 0 #8f0000, 0 4px 6px rgba(0,0,0,0.15);
  }
  .toolbar button.save-btn { background: var(--accent-green); color: #fff; border-color: #3a7130; }
  .toolbar button.reset-btn { background: #fff; color: var(--text-sub); }
  .group-size-control { display: none; align-items: center; gap: 6px; }
  .group-size-control.visible { display: flex; }
  .group-size-control label { font-size: 13px; color: var(--text-sub); font-weight: 700; }
  .save-status {
    text-align: center; font-size: 12px; font-weight: 600;
    height: 18px; margin-top: -6px; margin-bottom: 6px; opacity: 0; transition: opacity 0.3s ease;
    color: var(--accent-green);
  }
  .save-status.show { opacity: 1; }
  .save-status.error { color: var(--accent-red); }
  .sync-indicator {
    text-align: center; font-size: 11px; color: var(--text-sub); margin-bottom: 10px;
    display: flex; justify-content: center; align-items: center; gap: 6px;
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; transition: background 0.3s ease; }
  .sync-dot.online { background: var(--accent-green); }
  .sync-dot.offline { background: var(--accent-red); }
  .instruction { text-align: center; font-size: 12.5px; color: var(--text-sub); margin: 0 0 14px 0; }
  #board { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: row; justify-content: center; align-items: flex-start; gap: 48px; position: relative; }
  .row-pair { display: flex; flex-direction: row; gap: 8px; }
  .seat-row { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #board.group-mode { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; align-items: start; }
  .group-box {
    display: grid; gap: 6px;
    background: repeating-linear-gradient(135deg, #f4e3c8, #f4e3c8 10px, #eed9b8 10px, #eed9b8 20px);
    border: 3px solid var(--wood-dark); border-radius: 12px; padding: 10px;
    box-shadow: 0 4px 0 rgba(139,90,43,0.3), inset 0 0 0 3px rgba(255,255,255,0.4);
  }
  .seat {
    background: var(--card-bg); border: 2px solid var(--wood-dark); border-top: 6px solid var(--accent-yellow);
    border-radius: 8px; padding: 10px 4px; text-align: center; min-height: 76px; width: 100px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer; user-select: none; -webkit-touch-callout: none;
    box-shadow: 0 3px 0 rgba(139,90,43,0.35), 0 4px 6px rgba(0,0,0,0.08);
    transition: box-shadow 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
    position: relative;
  }
  .seat::before, .seat::after {
    content: ""; position: absolute; width: 5px; height: 5px; background: var(--wood-dark);
    border-radius: 50%; top: 4px; opacity: 0.6;
  }
  .seat::before { left: 5px; }
  .seat::after { right: 5px; }
  .seat.seat-empty { border-style: dashed; opacity: 0.55; }
  .group-box .seat { width: 100%; }
  .seat.seat-selected {
    box-shadow: 0 0 0 3px var(--accent-red), 0 5px 0 rgba(241,6,11,0.35), 0 6px 12px rgba(0,0,0,0.15);
    border-color: var(--accent-red); border-top-color: var(--accent-red); transform: scale(1.06);
  }
  .seat:active { transform: scale(0.97); }
  .name-zh { font-size: 14px; font-weight: 700; color: var(--text-main); }
  .name-en { font-size: 11px; color: var(--text-sub); margin-top: 2px; }
  .seat input {
    width: 90%; text-align: center; border: none; background: transparent; font-size: 13px;
    font-weight: 700; outline: none; color: var(--text-main);
  }
  .seat input.en-input { font-size: 10px; font-weight: 400; color: var(--text-sub); }
  .footer-banner { text-align: center; margin-top: 30px; }
  .footer-banner img { max-width: 100%; max-height: 160px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  #importFileInput { display: none; }
</style>
</head>
<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>
<span class="star star1">&#9733;</span>
<span class="star star2">&#9733;</span>
<span class="star star3">&#9733;</span>
<span class="star star4">&#9733;</span>

<div class="content">

<div class="title-wrap">
  <h1 id="planTitle" ondblclick="editTitle()">6A 課室座位表</h1>
</div>

<div class="sync-indicator">
  <span class="sync-dot" id="syncDot"></span>
  <span id="syncText">連接中...</span>
</div>

<div class="toolbar">
  <button id="btnStandard" class="active" onclick="setMode('standard')">標準排列（雙行成組）</button>
  <button id="btnGroup" onclick="setMode('group')">分組排列</button>
  <div class="group-size-control" id="groupSizeControl">
    <label for="groupSizeSelect">每組人數:</label>
    <select id="groupSizeSelect" onchange="onGroupSizeChange()">
      <option value="2">2人</option>
      <option value="3">3人</option>
      <option value="4" selected>4人</option>
      <option value="5">5人</option>
      <option value="6">6人</option>
    </select>
  </div>
</div>

<div class="toolbar">
  <button class="reset-btn" onclick="resetToDefault()">&#8635; 還原預設名單</button>
  <button onclick="exportData()">&#11015; 匯出備份 (JSON)</button>
  <button onclick="document.getElementById('importFileInput').click()">&#11014; 匯入備份</button>
  <input type="file" id="importFileInput" accept=".json" onchange="importData(event)">
</div>
<div class="save-status" id="saveStatus">已同步</div>

<p class="instruction">點選第一位學生（會出現紅框），再點選要交換的另一位學生（可以是空白座位），即完成互換座位｜雙擊姓名可直接編輯｜雙擊標題可修改班別名稱｜所有改動會自動同步到雲端</p>

<div id="board"></div>

<div class="footer-banner">
  <img src="images/To-Infinity-and-Beyond.jpg" alt="To Infinity and Beyond" onerror="this.style.display='none'">
</div>

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDfVyD6Qupj-upM6I4-6ytThBW8yIudNEQ",
  authDomain: "a-seating-plan-ee22d.firebaseapp.com",
  projectId: "a-seating-plan-ee22d",
  storageBucket: "a-seating-plan-ee22d.firebasestorage.app",
  messagingSenderId: "172329225759",
  appId: "1:172329225759:web:a4e62342f4eb6cad0acf2a"
};

const PLAN_DOC_ID = "6A";

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const planRef = db.collection("seatingPlans").doc(PLAN_DOC_ID);

const originalDefaultStudents = [
  {zh:"區錦浩",   en:"AU KAM HO"},
  {zh:"張敏敏",   en:"CHEUNG MAN MAN"},
  {zh:"趙家樂",   en:"CHIU KA LOK"},
  {zh:"",         en:"GABRIEL PHILIP MILNE"},
  {zh:"韓伊晨",   en:"HAN YI SEN"},
  {zh:"詹皓然",   en:"JIM HO YIN"},
  {zh:"林卓瑤",   en:"LAM CHEUK YIU"},
  {zh:"梁家逸",   en:"LEUNG KA YAT"},
  {zh:"梁念恩",   en:"LEUNG NIM YAN"},
  {zh:"李韋成",   en:"LI WAI SHING"},
  {zh:"李彦彤",   en:"LI YANTONG"},
  {zh:"文諾彥",   en:"MAN NOK YIN"},
  {zh:"吳梓淇",   en:"NG TSZ KI"},
  {zh:"黃倬朣",   en:"WONG CHEUK TUNG"},
  {zh:"黃溢鋒",   en:"WONG YAT FUNG Tyrus"},
  {zh:"曾溱翔",   en:"ZENG TSUN CHEUNG"}
];

const STANDARD_GROUPS_CONFIG = [
  { cols: 2, rows: 3 },
  { cols: 2, rows: 4 },
  { cols: 2, rows: 3 }
];

function getStandardCapacity() {
  return STANDARD_GROUPS_CONFIG.reduce((sum, g) => sum + g.cols * g.rows, 0);
}

const BLANK = { zh: "", en: "" };

function buildDefaultLayout(list16) {
  const left = list16.slice(0, 4);
  const middle = list16.slice(4, 12);
  const right = list16.slice(12, 16);
  return [
    ...left, BLANK, BLANK,
    ...middle,
    ...right, BLANK, BLANK
  ];
}

const defaultStudents = buildDefaultLayout(originalDefaultStudents);

function padToStandardSize(list) {
  const capacity = getStandardCapacity();
  const padded = list.slice();
  while (padded.length < capacity) padded.push({ zh: "", en: "" });
  if (padded.length > capacity) padded.length = capacity;
  return padded;
}

let students = JSON.parse(JSON.stringify(defaultStudents));
let currentMode = "standard";
let currentGroupSize = 4;

let groupOrder = null;
let groupOrderSize = null;

const board = document.getElementById("board");
let saveTimer = null;
let isApplyingRemoteUpdate = false;
let isEditingSomething = false;
let pendingRemoteData = null;
let hasUnsavedLocalChange = false;

function isRealStudent(s) {
  return !!((s.zh && s.zh.trim()) || (s.en && s.en.trim()));
}

function clearSelection() {
  if (selectedSeat) { selectedSeat.classList.remove("seat-selected"); selectedSeat = null; }
  if (pendingRemoteData) {
    const data = pendingRemoteData;
    pendingRemoteData = null;
    applyRemoteData(data);
  }
}

function clearSelectionForLocalAction() {
  if (selectedSeat) { selectedSeat.classList.remove("seat-selected"); selectedSeat = null; }
  pendingRemoteData = null;
}

let selectedSeat = null;
let clickTimers = new WeakMap();

function handleSeatClick(seatEl) {
  if (seatEl.querySelector("input")) return;
  if (!selectedSeat) {
    selectedSeat = seatEl;
    seatEl.classList.add("seat-selected");
  } else if (selectedSeat === seatEl) {
    clearSelection();
  } else {
    swapSeatContent(selectedSeat, seatEl);
    clearSelectionForLocalAction();
    hasUnsavedLocalChange = true;
    syncFromDOM();
    scheduleCloudSave();
  }
}

function swapSeatContent(seatA, seatB) {
  const zhA = seatA.querySelector(".name-zh"), enA = seatA.querySelector(".name-en");
  const zhB = seatB.querySelector(".name-zh"), enB = seatB.querySelector(".name-en");
  const tmpZh = zhA.textContent, tmpEn = enA.textContent;
  zhA.textContent = zhB.textContent; enA.textContent = enB.textContent;
  zhB.textContent = tmpZh; enB.textContent = tmpEn;
  updateEmptyStyle(seatA);
  updateEmptyStyle(seatB);
}

function updateEmptyStyle(seatEl) {
  const zh = seatEl.querySelector(".name-zh")?.textContent.trim() || "";
  const en = seatEl.querySelector(".name-en")?.textContent.trim() || "";
  seatEl.classList.toggle("seat-empty", !zh && !en);
}

function cancelPendingClickTimer(seatEl) {
  const t = clickTimers.get(seatEl);
  if (t) { clearTimeout(t); clickTimers.delete(seatEl); }
}

function attachSeatInteraction(seatEl) {
  seatEl.addEventListener("click", (e) => {
    if (e.target.tagName === "INPUT") return;
    cancelPendingClickTimer(seatEl);
    const t = setTimeout(() => { handleSeatClick(seatEl); clickTimers.delete(seatEl); }, 280);
    clickTimers.set(seatEl, t);
  });
  seatEl.addEventListener("dblclick", (e) => {
    if (e.target.tagName === "INPUT") return;
    cancelPendingClickTimer(seatEl);
  });
}

function makeSeatEl(s, i) {
  const seat = document.createElement("div");
  seat.className = "seat";
  seat.dataset.index = i;
  const zhDisplay = s.zh || "";
  const enDisplay = s.en || "";
  if (!zhDisplay && !enDisplay) seat.classList.add("seat-empty");
  seat.innerHTML = `
    <span class="name-zh" ondblclick="editName(event, this, 'zh')">${zhDisplay}</span>
    <span class="name-en" ondblclick="editName(event, this, 'en')">${enDisplay}</span>
  `;
  attachSeatInteraction(seat);
  return seat;
}

function editTitle() {
  isEditingSomething = true;
  const h1 = document.getElementById("planTitle");
  const current = h1.textContent;
  const input = document.createElement("input");
  input.id = "titleInput"; input.value = current;
  h1.replaceWith(input); input.focus(); input.select();
  function save() {
    const newH1 = document.createElement("h1");
    newH1.id = "planTitle"; newH1.setAttribute("ondblclick", "editTitle()");
    newH1.textContent = input.value.trim() || current;
    input.replaceWith(newH1);
    isEditingSomething = false;
    hasUnsavedLocalChange = true;
    scheduleCloudSave();
  }
  input.addEventListener("blur", save);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
}

function editName(event, span, type) {
  event.stopPropagation();
  const seatEl = span.closest(".seat");
  if (seatEl) cancelPendingClickTimer(seatEl);
  clearSelectionForLocalAction();
  isEditingSomething = true;
  const current = span.textContent;
  const input = document.createElement("input");
  input.className = type === "en" ? "en-input" : "";
  input.value = current; span.replaceWith(input); input.focus(); input.select();
  function save() {
    const newSpan = document.createElement("span");
    newSpan.className = type === "en" ? "name-en" : "name-zh";
    newSpan.textContent = input.value.trim();
    newSpan.setAttribute("ondblclick", `editName(event, this, '${type}')`);
    input.replaceWith(newSpan);
    if (seatEl) updateEmptyStyle(seatEl);
    isEditingSomething = false;
    hasUnsavedLocalChange = true;
    syncFromDOM();
    scheduleCloudSave();
  }
  input.addEventListener("blur", save);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });
}

function syncStudentsFromDOM() {
  const seatEls = board.querySelectorAll(".seat");
  const newStudents = [];
  seatEls.forEach(el => {
    const zh = el.querySelector(".name-zh")?.textContent.trim() || "";
    const en = el.querySelector(".name-en")?.textContent.trim() || "";
    newStudents.push({ zh, en });
  });
  students = newStudents;
}

function syncGroupOrderFromDOM() {
  const seatEls = board.querySelectorAll(".seat");
  const newOrder = [];
  seatEls.forEach(el => {
    const zh = el.querySelector(".name-zh")?.textContent.trim() || "";
    const en = el.querySelector(".name-en")?.textContent.trim() || "";
    newOrder.push({ zh, en });
  });
  groupOrder = newOrder;

  const newRealOrder = newOrder.filter(isRealStudent);
  let ptr = 0;
  students = students.map((s) => {
    if (isRealStudent(s)) {
      const val = newRealOrder[ptr] || s;
      ptr++;
      return val;
    }
    return s;
  });
}

function syncFromDOM() {
  if (currentMode === "group") {
    syncGroupOrderFromDOM();
  } else {
    syncStudentsFromDOM();
  }
}

function renderStandard() {
  board.className = ""; board.innerHTML = ""; clearSelectionSilently();

  students = padToStandardSize(students);

  let idx = 0;
  STANDARD_GROUPS_CONFIG.forEach((group) => {
    const pair = document.createElement("div");
    pair.className = "row-pair";
    for (let c = 0; c < group.cols; c++) {
      const rowEl = document.createElement("div");
      rowEl.className = "seat-row";
      for (let r = 0; r < group.rows; r++) {
        const s = students[idx] || { zh: "", en: "" };
        rowEl.appendChild(makeSeatEl(s, idx));
        idx++;
      }
      pair.appendChild(rowEl);
    }
    board.appendChild(pair);
  });
}

function clearSelectionSilently() {
  if (selectedSeat) { selectedSeat = null; }
}

function getGroupGridColumns(size) {
  if (size <= 2) return size;
  if (size === 3) return 3;
  if (size === 4) return 2;
  if (size === 5) return 3;
  if (size === 6) return 3;
  return Math.ceil(Math.sqrt(size));
}

function buildFreshGroupOrder(groupSize) {
  const realStudents = students.filter(isRealStudent);
  const padded = realStudents.slice();
  while (padded.length % groupSize !== 0) padded.push({ zh: "", en: "" });
  for (let i = 0; i < groupSize; i++) padded.push({ zh: "", en: "" });
  return padded;
}

function ensureGroupOrder(groupSize) {
  const currentRealCount = students.filter(isRealStudent).length;
  const existingRealCount = groupOrder ? groupOrder.filter(isRealStudent).length : -1;
  if (!groupOrder || groupOrderSize !== groupSize || existingRealCount !== currentRealCount) {
    groupOrder = buildFreshGroupOrder(groupSize);
    groupOrderSize = groupSize;
  }
  return groupOrder;
}

function renderGroup() {
  board.className = "group-mode"; board.innerHTML = ""; clearSelectionSilently();
  const groupSize = currentGroupSize, cols = getGroupGridColumns(groupSize);

  const order = ensureGroupOrder(groupSize);

  const totalGroups = order.length / groupSize;
  let idx = 0;
  for (let g = 0; g < totalGroups; g++) {
    const box = document.createElement("div"); box.className = "group-box";
    box.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    for (let k = 0; k < groupSize; k++) {
      box.appendChild(makeSeatEl(order[idx], idx));
      idx++;
    }
    board.appendChild(box);
  }
}

function onGroupSizeChange() {
  currentGroupSize = parseInt(document.getElementById("groupSizeSelect").value, 10);
  groupOrder = null;
  hasUnsavedLocalChange = true;
  renderGroup();
  scheduleCloudSave();
}

function setMode(mode) {
  currentMode = mode;
  document.getElementById("btnStandard").classList.toggle("active", mode === "standard");
  document.getElementById("btnGroup").classList.toggle("active", mode === "group");
  document.getElementById("groupSizeControl").classList.toggle("visible", mode === "group");
  hasUnsavedLocalChange = true;
  if (mode === "standard") renderStandard(); else renderGroup();
  scheduleCloudSave();
}

function getCurrentTitle() {
  return document.getElementById("planTitle")?.textContent || "課室座位表";
}

function buildDataPayload() {
  return {
    title: getCurrentTitle(),
    students: students,
    mode: currentMode,
    groupSize: currentGroupSize,
    groupOrder: groupOrder,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  };
}

function saveToCloud(showToast) {
  const data = buildDataPayload();
  planRef.set(data)
    .then(() => {
      hasUnsavedLocalChange = false;
      pendingRemoteData = null;
      if (showToast) showSaveStatus("已同步 " + new Date().toLocaleTimeString("zh-HK"), false);
    })
    .catch((err) => {
      console.error(err);
      hasUnsavedLocalChange = false;
      if (showToast) showSaveStatus("同步失敗,請檢查網絡", true);
    });
}

function scheduleCloudSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveToCloud(true), 500);
}

function showSaveStatus(msg, isError) {
  const el = document.getElementById("saveStatus");
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  el.classList.add("show");
  clearTimeout(el._hideTimer);
  el._hideTimer = setTimeout(() => el.classList.remove("show"), 2500);
}

function setSyncIndicator(status) {
  const dot = document.getElementById("syncDot");
  const text = document.getElementById("syncText");
  dot.className = "sync-dot " + status;
  if (status === "online") text.textContent = "已連接雲端,即時同步中";
  else if (status === "offline") text.textContent = "連接中斷,將於恢復連線後同步";
  else text.textContent = "連接中...";
}

function applyRemoteData(data) {
  isApplyingRemoteUpdate = true;
  students = Array.isArray(data.students) ? data.students : students;
  currentMode = data.mode || "standard";
  currentGroupSize = data.groupSize || 4;
  groupOrder = Array.isArray(data.groupOrder) ? data.groupOrder : null;
  groupOrderSize = groupOrder ? currentGroupSize : null;
  document.getElementById("planTitle").textContent = data.title || "課室座位表";
  document.getElementById("groupSizeSelect").value = String(currentGroupSize);
  document.getElementById("btnStandard").classList.toggle("active", currentMode === "standard");
  document.getElementById("btnGroup").classList.toggle("active", currentMode === "group");
  document.getElementById("groupSizeControl").classList.toggle("visible", currentMode === "group");
  if (currentMode === "standard") renderStandard(); else renderGroup();
  isApplyingRemoteUpdate = false;
}

let firstSnapshotHandled = false;
planRef.onSnapshot({ includeMetadataChanges: true }, (doc) => {
  setSyncIndicator("online");

  if (doc.metadata.hasPendingWrites) {
    return;
  }

  if (!doc.exists) {
    if (!firstSnapshotHandled) {
      firstSnapshotHandled = true;
      saveToCloud(false);
    }
    return;
  }

  const data = doc.data();
  if (isEditingSomething) return;

  if (selectedSeat || hasUnsavedLocalChange) {
    pendingRemoteData = data;
    return;
  }

  applyRemoteData(data);
  firstSnapshotHandled = true;
}, (err) => {
  console.error("Firestore監聽錯誤:", err);
  setSyncIndicator("offline");
});

function resetToDefault() {
  if (!confirm("確定要還原成預設名單嗎?這會覆蓋雲端上目前的座位資料,所有裝置都會看到還原後的結果。")) return;
  students = JSON.parse(JSON.stringify(defaultStudents));
  currentMode = "standard"; currentGroupSize = 4;
  groupOrder = null;
  document.getElementById("planTitle").textContent = "6A 課室座位表";
  hasUnsavedLocalChange = true;
  setMode("standard");
  saveToCloud(true);
}

function exportData() {
  const data = { title: getCurrentTitle(), students, mode: currentMode, groupSize: currentGroupSize, groupOrder, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "seating_plan_backup_" + new Date().toISOString().slice(0,10) + ".json";
  a.click(); URL.revokeObjectURL(url);
  showSaveStatus("已匯出備份檔", false);
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!Array.isArray(data.students)) throw new Error("格式不正確");
      students = data.students;
      currentMode = data.mode || "standard";
      currentGroupSize = data.groupSize || 4;
      groupOrder = Array.isArray(data.groupOrder) ? data.groupOrder : null;
      groupOrderSize = groupOrder ? currentGroupSize : null;
      document.getElementById("planTitle").textContent = data.title || "課室座位表";
      document.getElementById("groupSizeSelect").value = String(currentGroupSize);
      hasUnsavedLocalChange = true;
      setMode(currentMode);
      saveToCloud(true);
    } catch (err) {
      alert("匯入失敗,檔案格式不正確");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

setMode("standard");
</script>
