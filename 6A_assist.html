<header><h1>✏️ 記敍文作文練習(約400字)</h1>
<button onclick="setView('main')">📝 寫作</button><button onclick="setView('sample')">📖 示範範文</button><button onclick="setView('style')">🎨 名家風格變身</button><button onclick="clearAll()">🗑 清除重寫</button></header>
<div id="toast"></div>
<div class="wrap"><div id="top"></div><div id="app"></div><div id="nav" style="text-align:center"><button class="g" onclick="go(-1)">⬅ 上一步</button><button onclick="go(1)" id="nx">下一步 ➡</button></div></div>
<div id="bot"><div id="bubble"></div><div id="pick"></div><div style="display:flex;align-items:center;gap:6px"><button class="s" onclick="togglePick()">🔄 換小助手</button><div id="face" onclick="cheer()" title="點我打氣!">🐱</div></div></div>
<script>
const KEY='essayV4',HKEY='essayHelper';

function clearAll(){if(confirm('確定清除全部內容重新開始?')){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}
const HELPERS=[
{e:'🐱',n:'貓貓',l:['你寫得好棒,繼續喵喵加油!','慢慢寫,每一句都是進步喔!','細心觀察,你一定寫得到精彩的句子!']},
{e:'🐶',n:'旺旺',l:['汪汪!你好叻,不要放棄!','寫多一句,就離終點近一步!','我相信你可以完成,加油加油!']},
{e:'🐼',n:'熊貓',l:['慢慢來,不用急,你做得很好!','深呼吸,再想一想,好句子就來了!','每天進步一點點,就是大進步!']},
{e:'🦊',n:'小狐狸',l:['你的想法很特別,大膽寫出來!','用心描寫,我已經看到畫面了!','聰明的你,一定想到好點子!']},
{e:'🐰',n:'小白兔',l:['跳一跳,再寫一句,你辦得到!','你已經很棒了,繼續向前跳!','別怕寫錯,錯了可以改,勇敢試試!']},
{e:'🐧',n:'企鵝',l:['冷靜一點,一步一步慢慢走,就會到達!','堅持就是勝利,我在旁邊支持你!','寫完這一格,就可以拿星星了!']},
{e:'🦄',n:'獨角獸',l:['你的文章充滿魔法,繼續寫下去!','相信自己,你比想像中更厲害!','用想像力飛起來,寫出彩虹般的句子!']},
{e:'🤖',n:'機械人',l:['系統檢測:你的能力 100%,繼續運行!','加油程序啟動!請繼續輸入精彩句子!','任務進度良好,保持下去,指揮官!']},
{e:'🐥',n:'小雞',l:['吱吱!你是最勇敢的小作家!','一個字一個字,慢慢孵出好文章!','別放棄,太陽就快出來了!']},
{e:'🐲',n:'小飛龍',l:['噴火!把你的熱情寫進文章裏!','你有龍一樣的力量,衝過終點吧!','每一句都是你的努力,我為你自豪!']}];
let hi=parseInt(lsGet(HKEY)||'0')||0,hTimer;
if(hi<0||hi>=HELPERS.length)hi=0;
function showH(){document.getElementById('face').textContent=HELPERS[hi].e;
 document.getElementById('pick').innerHTML=HELPERS.map((h,i)=>`<div class="${i==hi?'cur':''}" title="${h.n}" onclick="chooseH(${i})">${h.e}</div>`).join('')}
function say(t){const b=document.getElementById('bubble');b.textContent=HELPERS[hi].e+' '+HELPERS[hi].n+':'+t;b.classList.add('show');
 const f=document.getElementById('face');f.classList.remove('jump');void f.offsetWidth;f.classList.add('jump');clearTimeout(hTimer);hTimer=setTimeout(()=>b.classList.remove('show'),5000)}
function cheer(){const l=HELPERS[hi].l;say(l[Math.floor(Math.random()*l.length)])}
function chooseH(i){hi=i;lsSet(HKEY,i);showH();cheer();document.getElementById('pick').classList.remove('show')}
function togglePick(){document.getElementById('pick').classList.toggle('show')}
const TOPICS=[["一次難忘的旅行","去了哪裏?最深刻的是什麼?"],["一件開心的事","什麼事令你最開心?"],["一次難忘的比賽","比賽項目、緊張時刻、結果"],["一次犯錯的經歷","做錯了什麼?如何改正?"],["一次幫助別人的經歷","幫了誰?當時怎樣做?"],["我最難忘的一位老師","老師做了什麼令你難忘?"],["一次迷路的經歷","在哪裏迷路?怎樣找到路?"],["一個特別的生日","怎樣慶祝?誰在你身邊?"],["一次勇敢的挑戰","挑戰什麼?克服了什麼困難?"],["一次令我感動的事","誰令你感動?為什麼?"]];
const AU={

"冰心風格":{d:"清新溫柔,充滿愛與感恩",open:["那天的天空藍得像一塊透明的水晶,連風也帶着微微的甜味。","我的心裏盛滿了喜悅,像一朵含着露珠、剛剛綻放的小花。"],mid:["媽媽那雙溫暖的手,輕輕撫過我的頭髮,所有的不安都悄悄散去了。","一句小小的鼓勵,像春天的細雨,滋潤着我乾涸的心田。"],end:["我明白到,愛是最柔軟,也是最有力量的東西。","我決定把得到的溫暖傳給更多的人,讓它像星星一樣,一顆接一顆地亮起來。"]},
"魯迅風格":{d:"簡練冷靜,觀察入微,善用白描",open:["天色陰沉,街上行人不多,只有風,一陣一陣地刮過。","我站在門口,看着遠處,心裏忽然空了一塊。"],mid:["他不說話,只是低着頭,眼睛盯着地面,好像地上藏着什麼似的。","我的臉驟然紅了,手也不知該放在哪裏,只覺得周圍的目光都落在身上。"],end:["我這才明白,真正的勇氣,不在於不害怕,而在於害怕時仍然向前走。","這件事我不大說起,但它一直在那裏,像一根細針,時時提醒着我。"]},
"老舍風格":{d:"口語自然、生動幽默,有生活味",open:["說起那天,我到現在還想笑,又有點臉紅。","那天一早,家裏就熱鬧起來了,媽媽忙得像個陀螺,轉個不停。"],mid:["我心裏直打鼓,腿軟得跟麵條似的,可又不好意思說不去。","大家你一言我一語,吵得像一鍋煮開了的粥,誰也聽不清誰。"],end:["這件事叫我明白了:吹牛不如動手,說得再漂亮,不如做得實在。","往後想起這一天,我準會笑出聲來,心裏還熱乎乎的。"]},
"林海音風格":{d:"童真細膩,善寫人情與回憶",open:["那年我還小,小得連書包都比別人的大一號,可那一天的事,卻記得清清楚楚。","回想起來,那是個再平常不過的下午,可偏偏就在那個下午,發生了一件不平常的事。"],mid:["她沒有說什麼,只是悄悄把一塊糖塞進我手心,糖紙在陽光下閃了一下。","我低着頭,眼淚一滴一滴掉在鞋尖上,心裏又委屈,又說不出口。"],end:["長大以後我才漸漸懂得,有些溫暖,是在當時沒發覺,日後才慢慢暖起來的。","那個下午,我會一直帶在身上,就像帶着一盞不會熄滅的小燈。"]}};
const P=[
{k:'shi',sec:1,lab:'⏰ 時',en:'Time / Place / People',hint:'時間、地點、人物',conn:['那天,','上個星期日,','一天早上,'],

 chips:[["那是一個陽光明媚的星期六早上,我和家人來到公園。","直接"],["要數我這輩子最難忘的一天,就是去年暑假的那個下午。","點題"],["那天是學校旅行日,我和同學們一早就在校門口集合。","學校"],["上星期日,我和好朋友相約一起去圖書館。","朋友"]]},
{k:'jing',sec:1,lab:'🌳 景',en:'Scenery',hint:'環境景物(可用五感)',conn:['四周,','抬頭一看,','一陣風吹來,'],
 simple:[["太陽很大,天空很藍。","The sun is big and the sky is blue."],["公園裏有很多花,很漂亮。","There are many flowers in the park. They are pretty."]],

 simple:[["忽然,下起大雨來。","Suddenly, it started to rain heavily."],["我摔倒了,很痛。","I fell down. It hurt."]],

const FULL={"shi": ["那是一個星期六的早上,我和家人一起出門。", "上個月的一天,我和同學們一起參加學校的活動。", "去年暑假的一個下午,發生了一件令我永遠難忘的事。", "那天是個特別的日子,我一早就醒來了。"], "jing": ["天空藍藍的,太陽暖暖地照着大地,四周的景色非常漂亮。", "街上人來人往,到處都很熱鬧,空氣中充滿了歡樂的氣氛。", "天空灰濛濛的,風一陣陣吹來,讓人覺得有點涼。", "微風輕輕吹過,樹葉沙沙作響,好像在歡迎我們。"], "xin": ["我的心情又興奮又緊張,心跳得像打鼓一樣。", "我心裏充滿期待,連走路都變得輕快起來。", "我有點害怕,手心不停冒汗。", "我心裏很不安,不知道接下來會發生什麼事。", "我暗暗告訴自己,不管發生什麼事,我都要盡力面對。"], "kai": ["一開始,一切都很順利,大家有說有笑。", "原來,今天要做一件很特別的事,我們都很期待。", "首先,我們做好準備,然後就出發了。", "家人向我們講解了今天要做的事,我們認真地聽着。"], "tu": ["就在這時,意想不到的事情發生了,我一下子呆住了。", "忽然,出現了一個問題,大家都慌張起來。", "正當我們以為一切順利時,突然發生了意外。", "我鼓起勇氣,深深吸了一口氣,決定自己去解決。"], "guo": ["最後,問題終於解決了,大家都鬆了一口氣,露出了笑容。", "雖然過程很辛苦,但我們終於完成了,心裏感到非常自豪。", "結果不太理想,但我已經盡了力,心裏沒有遺憾。", "事情圓滿結束,我的眼睛不知不覺濕了,心裏暖暖的。"], "ming": ["這件事讓我明白到,遇到困難不要怕,只要不放棄,就會有辦法。", "我明白到,有朋友和家人在身邊互相幫忙,是多麼幸福的事。", "我明白到,做事要細心和有耐性,才不會出錯。", "我明白到,犯了錯不要緊,勇敢承認和改正才是最重要的。", "這個道理雖然簡單,卻讓我受益終身。", "(替代句式)這件事讓我深深體會到,只要努力,就一定能夠進步。", "(替代句式)經過這次經歷,我終於懂得要珍惜身邊的人。"], "jue": ["我決定以後遇到困難時,絕不輕易放棄。", "我決定要多關心身邊的人,常常說「謝謝」和「對不起」。", "我決定每天進步一點點,做一個更好的自己。", "我決定以後做事要更加小心,認真做好每一件事。", "我也會把這個道理告訴身邊的朋友,讓大家一起進步。", "(替代句式)從今以後,我下定決心要勇敢面對每一個挑戰。", "(替代句式)我暗暗向自己許下承諾:以後一定要做一個有責任感的人。"], "wang": ["我永不會忘記這難忘的一天!", "這一天就像一盞明燈,我永不會忘記它帶給我的力量。", "這段回憶將永遠留在我的心底,我永不會忘記這一天。", "無論過多少年,我都永不會忘記這難忘的一天。", "每次想起,我都忍不住微笑。"]};
const KIT={"一次難忘的旅行": ["去年暑假,我和爸爸媽媽一起到日本旅行,這是我第一次坐飛機。", "飛機降落後,眼前是一片藍天,街道乾淨整齊,路邊的樹木綠油油的,景色美極了。", "我既興奮又緊張,心跳得像打鼓一樣,好想快點看看這個新地方。", "我們先坐電車到酒店放下行李,然後拿着地圖,出發去遊覽。", "走着走着,我忽然發現自己和家人走散了,四周都是陌生的人,我一下子慌了起來。", "我想起爸爸說過要找穿制服的工作人員,便鼓起勇氣求助,不久就和家人團聚了,大家緊緊擁抱在一起。", "我明白到,遇到困難時要保持冷靜,勇敢向別人求助,事情就能解決。", "我決定以後出門要緊緊跟着家人,也要學好語言,做一個獨立的人。", "我永不會忘記這次難忘的旅行,它讓我學會了冷靜和勇敢。"], "一件開心的事": ["上星期六,是學校派發成績表的日子,我一早就來到學校。", "課室裏光猛明亮,窗外陽光燦爛,同學們都坐得端端正正,安靜地等待着。", "我坐在座位上,心裏既期待又緊張,手心都出汗了。", "老師一個一個地叫同學的名字,輪到我時,我慢慢走上前去。", "老師微笑着對我說:「恭喜你,這次你進步了很多,是全班進步最大的同學!」我一時呆住了,不敢相信自己的耳朵。", "同學們都為我鼓掌,我開心得笑了起來,眼睛也有點濕,心裏像開出了一朵花。", "我明白到,只要付出努力,一定會有回報。", "我決定以後繼續努力學習,也要鼓勵其他同學一起進步。", "我永不會忘記這開心的一天,它是我努力的最好證明。"], "一次難忘的比賽": ["上個月的一個星期五下午,學校舉行陸運會,我要參加四百米接力賽。", "操場上彩旗飄揚,同學們的歡呼聲此起彼落,太陽曬得跑道閃閃發亮。看台上,老師和家長都站了起來,為我們加油打氣。", "我站在起跑線上,心像一面小鼓,咚咚咚地亂跳,手心也冒出了汗。", "槍聲一響,第一棒的同學像箭一樣衝了出去,我在第三棒的位置焦急地等待着。", "就在交棒時,接力棒忽然掉到地上!全場一陣驚呼,我的腦海一片空白。第二棒的同學立刻彎腰拾起,拚命追趕,終於把棒交到我手裏,我使盡全身力氣向前衝。", "最後,我們只得第三名,可是大家抱在一起又笑又叫,比拿冠軍還要開心。", "我明白到,團結合作比輸贏更重要,只要不放棄,就一定有希望。", "我決定以後遇到困難都要堅持到底,也要主動鼓勵身邊的人。", "我永不會忘記這難忘的比賽,它像一盞小燈,一直照亮着我。"], "一次犯錯的經歷": ["上個學期的一個中午,我在課室裏和同學玩耍。", "課室裏吵吵鬧鬧,窗外的天空灰濛濛的,看起來快要下雨了。", "我覺得很無聊,心想:「老師不在,玩一會兒應該沒問題吧!」", "我拿起同學的水壺,和他你追我趕地跑來跑去。", "忽然,「砰」的一聲,水壺掉在地上,水濺得到處都是,同學的書本也濕了。我嚇得臉色發白,呆呆地站在原地。", "我鼓起勇氣向同學道歉,並幫忙抹乾書本,後來又主動告訴了老師。老師沒有責罵我,還稱讚我誠實。", "我明白到,犯了錯不要緊,勇敢承認和改正才是最重要的。", "我決定以後在課室裏要守規則,做事前先想一想後果。", "我永不會忘記這次犯錯的經歷,它教會了我要負責任。"], "一次幫助別人的經歷": ["上星期三放學後,我和同學一起走路回家。", "街上的車子來來往往,夕陽把天空染成了橙紅色,景色十分漂亮。", "我心情輕鬆,一邊走一邊和同學談笑。", "走到馬路旁,我看見一位老婆婆拿着很多東西,站在路邊。", "她想過馬路,卻因為手上的袋子太重,差點跌倒。我立刻跑上前去扶住她,心跳得很快。", "我幫她拿着袋子,慢慢陪她過了馬路,老婆婆笑着連聲說:「謝謝你,好孩子!」我心裏暖洋洋的。", "我明白到,幫助別人不需要很大的力量,一個小小的動作就能帶來溫暖。", "我決定以後多留意身邊需要幫助的人,盡自己所能去幫忙。", "我永不會忘記這次幫助別人的經歷,它讓我的心暖洋洋的。"], "我最難忘的一位老師": ["二年級的時候,我的班主任是我最難忘的老師。", "那天下午,課室裏很安靜,陽光從窗外灑進來,暖暖的。", "我對着一道數學題皺着眉頭,心裏又急又沮喪,差點哭了出來。", "下課後,老師走到我身邊,輕聲問我:「是不是遇到困難了?」", "老師沒有直接告訴我答案,而是一步一步地教我思考。在小息和放學後,她都耐心地陪着我練習,從來沒有不耐煩。", "後來,我終於弄懂了這道題,考試也取得了好成績,老師笑着向我豎起了大拇指,我開心極了。", "我明白到,老師的耐心和鼓勵,能讓我們有勇氣面對困難。", "我決定以後要努力學習,不辜負老師對我的期望。", "我永不會忘記這位難忘的老師,她的笑容會永遠留在我心裏。"], "一次迷路的經歷": ["去年的一個星期日,我和家人到商場購物。", "商場裏人山人海,燈光閃閃發亮,到處都是漂亮的商品。", "我被一間玩具店吸引住了,看得入迷,心裏開心極了。", "我看了好一會兒,才依依不捨地轉身,準備去找爸爸媽媽。", "可是,我一回頭,卻發現周圍都是陌生的面孔,爸爸媽媽不見了!我的心一下子跳得很快,眼淚也湧了出來。", "我想起老師說過要找保安幫忙,便走到服務台求助。不久,爸爸媽媽就趕來把我緊緊抱住,我終於放心了。", "我明白到,出門時要緊跟家人,遇到困難要冷靜,向可靠的人求助。", "我決定以後外出要緊緊跟着家人,不會隨便亂走。", "我永不會忘記這次迷路的經歷,它讓我學會了冷靜。"], "一個特別的生日": ["今年我的生日,是一個特別的日子。", "家裏掛滿了彩帶和氣球,桌上放着一個又大又漂亮的蛋糕,空氣中飄着甜甜的香味。", "我心裏充滿期待,不知道爸爸媽媽會給我什麼驚喜。", "晚上,家人和朋友都來了,大家圍在桌前,為我唱生日歌。", "燈忽然全部熄滅了,只剩下蛋糕上的燭光。這時,爸爸捧出了一份用心製作的禮物,是一本記錄我成長的相簿!", "我看着相簿裏一張張照片,感動得流下了眼淚,大家都為我鼓掌,我覺得自己好幸福。", "我明白到,最珍貴的禮物不是金錢,而是家人和朋友的愛。", "我決定以後要孝順父母,也要珍惜身邊每一個關心我的人。", "我永不會忘記這個特別的生日,它讓我感受到滿滿的愛。"], "一次勇敢的挑戰": ["上學期,學校舉辦故事比賽,我鼓起勇氣報名參加。", "比賽當天,禮堂裏坐滿了老師和同學,燈光明亮,氣氛十分緊張。", "我站在後台,雙腿發軟,心跳得連自己也聽得見。", "輪到我上台了,我深深吸了一口氣,一步一步走到麥克風前。", "開始講故事時,我的腦海忽然一片空白,忘記了接下來的內容,台下靜得連呼吸聲都聽得見。", "我定了定神,想起平日練習的情景,慢慢把故事講完。台下響起了熱烈的掌聲,我終於做到了!", "我明白到,勇敢不是不害怕,而是即使害怕也敢向前走。", "我決定以後遇到挑戰,都要勇敢嘗試,不再輕易退縮。", "我永不會忘記這次勇敢的挑戰,它讓我更有自信。"], "一次令我感動的事": ["去年冬天的一個晚上,我患了重感冒,發着高燒。", "窗外寒風呼呼地吹,房間裏只亮着一盞小小的檯燈,顯得格外安靜。", "我躺在牀上,全身無力,心裏又難受又害怕。", "媽媽發現後,立刻放下手上的工作,急忙走到我的牀邊。", "她用手摸摸我的額頭,二話不說就背起我,冒着寒風走到診所。我伏在她的背上,感覺到她的汗水濕透了衣服。", "醫生診治後,我吃了藥,慢慢退燒了。媽媽卻整夜沒睡,一直坐在牀邊照顧我,我的眼淚不知不覺流了下來。", "我明白到,媽媽的愛是無私的,她總是把我放在第一位。", "我決定要乖乖聽話,努力學習,將來好好報答媽媽。", "我永不會忘記這令我感動的一晚,媽媽的愛會永遠溫暖我的心。"]};

['k','開','槍聲一響,第一棒的同學像箭一樣衝了出去,我在第三棒的位置焦急地等待着,眼睛一眨也不敢眨。'],['u','突','就在他把接力棒交給第二棒時,忽然「啪」的一聲,接力棒掉到地上!全場一陣驚呼,我的腦海一片空白。只見第二棒的同學立刻彎腰拾起,咬緊牙關拚命追趕,終於把棒穩穩地交到我手裏。我緊緊握着接力棒,使盡全身力氣向前衝。'],['g','果','最後,我們只得到第三名,可是大家抱在一起又笑又叫,比拿了冠軍還要開心。看着隊友們滿頭大汗的笑臉,我的眼眶不禁熱了起來。'],
['m','明','回家的路上,我明白到,團結合作比輸贏更重要,只要不放棄,就一定有希望。'],['d','決','我決定以後無論遇到什麼困難,都要堅持到底,也要主動鼓勵身邊的人。'],['w','忘','我永不會忘記這難忘的陸運會,它像一盞小燈,一直照亮着我。']];
 const n=len(S.map(x=>x[2]).join(''));
 return `<div class="card sample"><h2>📖 示範範文:《一次難忘的比賽》</h2><div class="tip">不同顏色代表「時景心・開突果・明決忘」九個部分。留意:每部分都有,而且次序不變。</div>
 <p style="font-size:18px;line-height:2.2">${S.map((x,i)=>(i==0||i==3||i==6?'<br>　　':'')+`<span class="sec-${x[0]}">${x[2]}<sup>${x[1]}</sup></span>`).join('')}</p>
 <p class="cnt">全文約 ${n} 字</p>
 <h3>🔎 寫作手法小分析</h3><div class="chk">・「景」:用視覺(彩旗、跑道閃亮)、聽覺(歡呼聲)描寫。<br>・「心」:用比喻「心像一面小鼓」寫緊張。<br>・「突」:用「忽然」帶出轉折,再用動作(彎腰、追趕、衝)寫高潮。<br>・「明決忘」:由事情引出道理,再寫決定和難忘的感受,最後呼應題目。</div></div>`}
let SB=0,SA='all';
function styleHTML(){const o=STY[SB];const list=STY.map((x,i)=>`<span class="base ${i==SB?'sel':''}" onclick="SB=${i};render()">${PN[x.k]}:${x.base}</span>`).join('');
 const bar=['all',...AUN].map(n=>`<button class="au-b ${SA==n?'sel':''}" onclick="SA='${n}';render()">${n=='all'?'全部':n}</button>`).join('');
 const cards=AUN.map((n,i)=>({n,i})).filter(x=>SA=='all'||SA==x.n).map(x=>{const A=AUTH[x.n];return `<div class="scard"><b>${x.n}風格</b> <small>${A.d}</small><div class="t">${o.v[x.i]}</div><small>✏️ 寫法:${A.tips.join(' ‧ ')}</small><br><button class="s" onclick="useStyle(${x.i})">➕ 用這句(加入「${PN[o.k]}」格)</button></div>`}).join('');
 return `<div class="card"><h2>🎨 名家風格變身</h2><div class="tip">第1步:揀一句簡單句子。第2步:看看不同作家會怎樣寫。第3步:揀一款風格加入自己的文章。</div>
 <h3>① 揀一句簡單句子</h3>${list}<h3>② 揀作家風格</h3><div>${bar}</div>
 <div class="scard orig"><b>原句(簡單版)</b> <small>${PN[o.k]}</small><div class="t">${o.base}</div><button class="s" onclick="useBase()">➕ 用原句</button></div>${cards}
 <p class="ad">提示:這些是仿照各作家風格寫的示範句,不是作家原文。</p></div>`}
function pushTo(k,t){T.f[k]=(T.f[k]||'')+t;reward();save();toast('✅ 已加入「'+PN[k]+'」格,可返回「📝 寫作」查看');setTimeout(()=>say('加入了!回到寫作頁看看吧。'),400)}
function useStyle(i){const o=STY[SB];pushTo(o.k,o.v[i])}
function useBase(){const o=STY[SB];pushTo(o.k,o.base)}
function setView(v){view=v;render();scrollTo(0,0)}
function copyEssay(){const t=T.title+'\n'+[1,2,3].map(secText).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('已複製!'),()=>alert('複製失敗,請手動選取'));else alert('此瀏覽器不支援複製,請手動選取')}
function go(d){cur=Math.max(0,Math.min(4,cur+d));save();render();scrollTo(0,0);setTimeout(cheer,300)}
function render(){CH=[];const a=document.getElementById('app'),tp=document.getElementById('top'),nav=document.getElementById('nav');
 if(view!='main'){tp.innerHTML='';nav.style.display='none';a.innerHTML=view=='sample'?sample():styleHTML();return}
 nav.style.display='';tp.innerHTML=topHTML();document.getElementById('nx').style.display=cur==4?'none':'';
 if(cur==0){const has=len(all())>0;a.innerHTML=`<div class="card"><h2>第1步:揀題目</h2>${has?'<div class="tip">💾 已載入你上次的進度。</div>':''}
 <div class="rm">📌 記得三個口訣:<br><b>時景心</b>(開頭)→ <b>開突果</b>(經過)→ <b>明決忘</b>(結尾)<br><button class="s" onclick="setView('sample')">先看示範範文</button></div>
 <h3>👉 點選一個題目(或自己填寫)</h3><div class="chips">${TOPICS.map((t,i)=>`<div class="topic ${T.title==t[0]?'sel':''}" onclick="pick(${i})">${t[0]}</div>`).join('')}</div>
 <p>我的題目:<input type="text" id="ti" placeholder="或自己寫題目" value="${T.title}" oninput="T.title=this.value;save();document.querySelectorAll('.topic').forEach(e=>e.classList.remove('sel'));document.getElementById('kitbox').innerHTML=kitHTML()"></p>
 <div class="tip" id="hint">💭 選好題目後,這裏會有提示。</div><div id="kitbox">${kitHTML()}</div>
 <p>我的計劃(誰、何時、何地、什麼事、結果、感受)——可以不填:</p><textarea oninput="T.plan=this.value;save()">${T.plan}</textarea>
 <h3>⚙️ 支援選項</h3><label><input type="checkbox" ${simpleMode?'checked':''} onchange="simpleMode=this.checked;render()"> 簡易句子模式(句子較短,附英文翻譯 / Simple sentences with English)</label>
 <p class="ad">右下角的小助手會為你打氣,點牠或按「換小助手」可以更換!</p></div>`}
 else if(cur>=1&&cur<=3){const ps=P.filter(p=>p.sec==cur);if(!active||P.find(p=>p.k==active).sec!=cur)active=ps[0].k;
  a.innerHTML=`<div class="card"><h2>${steps[cur]}</h2><div class="tip">題目:${T.title||'(未選)'}。每格都有完整句子,直接點選就可以;想挑戰的同學可以自己改寫。想學名家寫法,請按上面「🎨 名家風格變身」。</div>
  <label><input type="checkbox" ${simpleMode?'checked':''} onchange="simpleMode=this.checked;render()"> 簡易句子模式(附英文)</label>
  ${ps.map((p,i)=>partHTML(p,(cur-1)*3+i+1)).join('')}${auHTML(cur)}<div class="chk" id="chk">${checkHTML(cur)}</div></div>`}
 else{const n=len(all());const segs=[1,2,3].map(secText);
  a.innerHTML=`<div class="card"><h2>第5步:完成與檢查</h2><h3 style="text-align:center">${T.title||'(未有題目)'}</h3>
  <div style="font-size:18px;line-height:2">${segs.map(x=>`<p>　　${x}</p>`).join('')}</div>
  <p class="cnt">總字數:<span class="${n>=400?'ok':''}">${n}</span> ${n>=400?'🎉 達標!':'(未夠400字,請補充)'}</p>
  <div class="chk">${checkHTML(0)}</div>
  <h3>✅ 自我檢查</h3>${["時:有時間、地點、人物","景:有環境描寫","心:有寫出心情","開:事情有清楚開始","突:有突發事件/高潮","果:有交代結果","明:我明白到……","決:我決定……","忘:我永不會忘記……","沒有錯別字、標點正確"].map(x=>`<label><input type="checkbox"> ${x}</label><br>`).join('')}
  <button onclick="copyEssay()">📋 複製文章</button><button class="g" onclick="window.print()">🖨 列印</button></div>`}markAll()}
showH();render();setTimeout(()=>say('你好!我是'+HELPERS[hi].n+',我會陪你一起寫作文!'),600);
</script></body></html>
