<script>

{e:'🐼',n:'熊貓',l:['慢慢來,不用急,你做得很好!','深呼吸,再想一想,好句子就來了!','每天進步一點點,就是大進步!']},
{e:'🦊',n:'小狐狸',l:['你的想法很特別,大膽寫出來!','用心描寫,我已經看到畫面了!','聰明的你,一定想到好點子!']},

{e:'🐥',n:'小雞',l:['吱吱!你是最勇敢的小作家!','一個字一個字,慢慢孵出好文章!','別放棄,太陽就快出來了!']},
{e:'🐲',n:'小飛龍',l:['噴火!把你的熱情寫進文章裏!','你有龍一樣的力量,衝過終點吧!','每一句都是你的努力,我為你自豪!']}];
let hi=parseInt(lsGet(HKEY)||'0')||0,hTimer;
if(hi<0||hi>=HELPERS.length)hi=0;
function showH(){document.getElementById('face').textContent=HELPERS[hi].e;
 document.getElementById('pick').innerHTML=HELPERS.map((h,i)=>`<div class="${i==hi?'cur':''}" title="${h.n}" onclick="chooseH(${i})">${h.e}</div>`).join('')}
function say(t){const b=document.getElementById('bubble');b.textContent=HELPERS[hi].e+' '+HELPERS[hi].n+':'+t;b.classList.add('show');
 const f=document.getElementById('face');f.classList.remove('jump');void f.offsetWidth;f.classList.add('jump');clearTimeout(hTimer);hTimer=setTimeout(()=>b.classList.remove('show'),5000)}
function cheer(){const l=HELPERS[hi].l;say(l[Math.floor(Math.random()*l.length)])}
function chooseH(i){hi=i;lsSet(HKEY,i);showH();cheer();document.getElementById('pick').classList.remove('show')}
function togglePick(){document.getElementById('pick').classList.toggle('show')}
const TOPICS=[["一次難忘的旅行","去了哪裏?最深刻的是什麼?"],["一件開心的事","什麼事令你最開心?"],["一次難忘的比賽","比賽項目、緊張時刻、結果"],["一次犯錯的經歷","做錯了什麼?如何改正?"],["一次幫助別人的經歷","幫了誰?當時怎樣做?"],["我最難忘的一位老師","老師做了什麼令你難忘?"],["一次迷路的經歷","在哪裏迷路?怎樣找到路?"],["一個特別的生日","怎樣慶祝?誰在你身邊?"],["一次勇敢的挑戰","挑戰什麼?克服了什麼困難?"],["一次令我感動的事","誰令你感動?為什麼?"]];

const P=[
{k:'shi',sec:1,lab:'⏰ 時',en:'Time / Place / People',hint:'時間、地點、人物',conn:['那天,','上個星期日,','一天早上,'],

 simple:[["我永不會忘記這難忘的一天。","I will never forget this unforgettable day."]],
 chips:[["我永不會忘記這難忘的一天!","基本"],["這一天,我永遠不會忘記,它是我成長路上最亮的一盞燈。","比喻"],["這段美好的回憶,將永遠留在我心底。","替代句式"],["無論過多少年,我都會記得這一天。","替代句式"]]}];
const SEC={1:["第一段(約100字)","時景心","時間地點人物・環境景物・當時心情"],2:["第二段(約200字)","開突果","事情開始・突發/高潮・結果"],3:["第三段(約100字)","明決忘","我明白到・我決定・我永不會忘記"]};
const AUK={1:'open',2:'mid',3:'end'};
const steps=["選題與計劃","第一段:時・景・心","第二段:開・突・果","第三段:明・決・忘","完成與檢查"];
let view='main',cur=0,active=null,simpleMode=false,CH=[];
let T={title:'',plan:'',f:{},earned:[]};P.forEach(p=>T.f[p.k]='');
try{const s=JSON.parse(lsGet(KEY)||'null');if(s&&s.T){T=Object.assign(T,s.T);T.f=Object.assign({},P.reduce((o,p)=>(o[p.k]='',o),{}),T.f);cur=s.cur||0}}catch(e){}
function save(){lsSet(KEY,JSON.stringify({T,cur}))}
function len(s){return s.replace(/\s/g,'').length}
function secText(n){return P.filter(p=>p.sec==n).map(p=>T.f[p.k]).join('')}
function all(){return P.map(p=>T.f[p.k]).join('')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function reward(){const E=T.earned;const g=(id,txt,ok)=>{if(ok&&!E.includes(id)){E.push(id);toast('🏅 獲得:'+txt);if(id[0]=='b')say('恭喜你!拿到徽章「'+txt+'」,太厲害了!')}};
 P.forEach(p=>g('s'+p.k,'⭐ '+p.lab+' 完成',len(T.f[p.k])>=12));
 g('b1','景物小專家',P.filter(p=>p.sec==1).every(p=>len(T.f[p.k])>=12));
 g('b2','故事大師',P.filter(p=>p.sec==2).every(p=>len(T.f[p.k])>=12));
 g('b3','立意小哲學家',P.filter(p=>p.sec==3).every(p=>len(T.f[p.k])>=12));
 g('b4','400字達人',len(all())>=400)}
function topHTML(){const n=P.filter(p=>len(T.f[p.k])>=12).length;const B={b1:'景物小專家',b2:'故事大師',b3:'立意小哲學家',b4:'400字達人'};
 return `<div class="fw">${[1,2,3].map(i=>`<div class="p ${cur==i?'on':''}">${SEC[i][0]}<b>${SEC[i][1]}</b>${SEC[i][2]}</div>`).join('')}</div>
 <div class="bar">${steps.map((_,i)=>`<div class="${i<=cur?'on':''}"></div>`).join('')}</div>
 <div class="badges">⭐ ${n}/9 ${T.earned.filter(x=>B[x]).map(x=>`<span>🏅${B[x]}</span>`).join('')}</div>`}
function chip(t,sub,cls,key){CH.push(t);return `<div class="chip ${cls}" onclick="addC(${CH.length-1},'${key||''}')">${t}${sub?`<small>${sub}</small>`:''}</div>`}
function addC(i,key){key=key||active;if(!key)return;const ta=document.getElementById('ta_'+key);if(!ta)return;ta.value+=CH[i];onIn(key)}
function addRaw(i,key){const ta=document.getElementById('ta_'+key);ta.value=CH[i]+ta.value;onIn(key)}
function onIn(k){const ta=document.getElementById('ta_'+k);T.f[k]=ta.value;document.getElementById('c_'+k).textContent='字數:'+len(ta.value);reward();save();
 const sec=P.find(p=>p.k==k).sec;document.getElementById('chk').innerHTML=checkHTML(sec)}
function speak(k){if(!window.speechSynthesis){toast('此瀏覽器不支援朗讀');return}const u=new SpeechSynthesisUtterance(T.f[k]||'');u.lang='zh-HK';speechSynthesis.cancel();speechSynthesis.speak(u)}
function setActive(k){active=k;document.querySelectorAll('.part').forEach(e=>e.classList.toggle('act',e.id=='part_'+k))}
function libSentences(){const a=[];P.forEach(p=>{p.chips.forEach(c=>a.push(c[0]));p.simple.forEach(c=>a.push(c[0]))});Object.values(AU).forEach(o=>['open','mid','end'].forEach(k=>o[k].forEach(s=>a.push(s))));return a.filter(s=>!s.includes('……'))}
function checkHTML(sec){const txt=sec?secText(sec):all();const L=[];const n=len(txt);
 const goal={1:100,2:200,3:100}[sec]||400;L.push(`${n>=goal*0.9?'✅':'⬜'} 字數 ${n} / 約${goal}字`);
 const kw=(w)=>txt.includes(w);
 if(!sec||sec==3){L.push(`${kw('我明白到')||kw('我終於懂得')||kw('體會到')||kw('領悟')?'✅':'⬜'} 有「明」(我明白到…)`);L.push(`${kw('我決定')||kw('下定決心')||kw('許下承諾')?'✅':'⬜'} 有「決」(我決定…)`);L.push(`${kw('永不會忘記')||kw('永遠不會忘記')||kw('永遠留在')||kw('都會記得')?'✅':'⬜'} 有「忘」(我永不會忘記…)`)}
 const punct=(txt.match(/[。!?!?]/g)||[]).length;const need=Math.max(1,Math.floor(n/45));L.push(`${punct>=need?'✅':'⚠️'} 句號/感嘆號 ${punct} 個${punct<need?'(句子太長?請加標點)':''}`);
 const d=(txt.match(/的/g)||[]).length,l=(txt.match(/了/g)||[]).length;
 if(n>0&&(d/n>0.07||l/n>0.05))L.push(`⚠️ 「的」${d}次、「了」${l}次,偏多,試試刪減或改寫`);
 const cp=libSentences().filter(s=>txt.includes(s)).length;
 L.push(cp>2?`⚠️ 有 ${cp} 句完全照抄佳句,請改寫部分字詞,加入自己的內容`:`✅ 照抄佳句 ${cp} 句(沒問題)`);
 return '<b>🔍 自動檢查</b><br>'+L.join('<br>')}
function pick(i){T.title=TOPICS[i][0];document.getElementById('ti').value=T.title;document.getElementById('hint').textContent='💭 想一想:'+TOPICS[i][1];document.querySelectorAll('.topic').forEach((e,j)=>e.classList.toggle('sel',i==j));save()}
function partHTML(p,idx){const ch=simpleMode?p.simple.map(c=>chip(c[0],c[1],'sm',p.k)).join(''):p.chips.map(c=>chip(c[0],c[1],'',p.k)).join('');
 return `<div class="part ${active==p.k?'act':''}" id="part_${p.k}"><b style="font-size:18px">第${idx}句 ${p.lab}</b> <span class="ad">${p.en}・${p.hint}</span>
 <div class="ad">連接詞:</div><div class="chips">${p.conn.map(c=>{CH.push(c);return `<div class="chip cn" onclick="addRaw(${CH.length-1},'${p.k}')">${c}</div>`}).join('')}</div>
 <details ${simpleMode?'open':''}><summary>${simpleMode?'簡易佳句(含英文)':'佳句庫'}(點選加入)</summary><div class="chips">${ch}</div></details>
 <textarea id="ta_${p.k}" onfocus="setActive('${p.k}')" oninput="onIn('${p.k}')" placeholder="寫下「${p.lab}」…(點選佳句後,記得改成自己的內容)">${T.f[p.k]}</textarea>
 <div class="cnt"><span id="c_${p.k}">字數:${len(T.f[p.k])}</span> <button class="s" onclick="speak('${p.k}')">🔊 朗讀</button></div></div>`}
function auHTML(sec){return `<h3>📚 名家風格句(仿寫示範,點選加入「目前選中的格」)</h3>`+Object.entries(AU).map(([n,o])=>`<div class="ad"><b>${n}</b>:${o.d}</div><div class="chips">`+o[AUK[sec]].map(s=>chip(s,n,'au','')).join('')+`</div>`).join('')}
function sample(){const S=[['t','時','上個月的一個星期五下午,學校舉行陸運會,我要參加四百米接力賽。'],['j','景','操場上彩旗飄揚,同學們的歡呼聲此起彼落,太陽曬得跑道閃閃發亮,連空氣都彷彿熱得冒煙。看台上,老師和家長都站了起來,為我們加油打氣。'],['x','心','我站在起跑線上,心像一面小鼓,咚咚咚地亂跳,手心也冒出了汗。'],
['k','開','槍聲一響,第一棒的同學像箭一樣衝了出去,我在第三棒的位置焦急地等待着,眼睛一眨也不敢眨。'],['u','突','就在他把接力棒交給第二棒時,忽然「啪」的一聲,接力棒掉到地上!全場一陣驚呼,我的腦海一片空白。只見第二棒的同學立刻彎腰拾起,咬緊牙關拚命追趕,終於把棒穩穩地交到我手裏。我緊緊握着接力棒,使盡全身力氣向前衝。'],['g','果','最後,我們只得到第三名,可是大家抱在一起又笑又叫,比拿了冠軍還要開心。看着隊友們滿頭大汗的笑臉,我的眼眶不禁熱了起來。'],
['m','明','回家的路上,我明白到,團結合作比輸贏更重要,只要不放棄,就一定有希望。'],['d','決','我決定以後無論遇到什麼困難,都要堅持到底,也要主動鼓勵身邊的人。'],['w','忘','我永不會忘記這難忘的陸運會,它像一盞小燈,一直照亮着我。']];
 const n=len(S.map(x=>x[2]).join(''));
 return `<div class="card sample"><h2>📖 示範範文:《一次難忘的比賽》</h2><div class="tip">不同顏色代表「時景心・開突果・明決忘」九個部分。留意:每部分都有,而且次序不變。</div>
 <p style="font-size:18px;line-height:2.2">${S.map((x,i)=>(i==0||i==3||i==6?'<br>　　':'')+`<span class="sec-${x[0]}">${x[2]}<sup>${x[1]}</sup></span>`).join('')}</p>
 <p class="cnt">全文約 ${n} 字</p>
 <h3>🔎 寫作手法小分析</h3><div class="chk">・「景」:用視覺(彩旗、跑道閃亮)、聽覺(歡呼聲)描寫。<br>・「心」:用比喻「心像一面小鼓」寫緊張。<br>・「突」:用「忽然」帶出轉折,再用動作(彎腰、追趕、衝)寫高潮。<br>・「明決忘」:由事情引出道理,再寫決定和難忘的感受,最後呼應題目。</div></div>`}
let G={i:0,score:0,q:[]};
function gameInit(){const q=[];Object.entries(AU).forEach(([n,o])=>['open','mid','end'].forEach(k=>o[k].forEach(s=>q.push([s,n]))));q.sort(()=>Math.random()-0.5);G={i:0,score:0,q:q.slice(0,10)}}
function gameHTML(){if(!G.q.length)gameInit();if(G.i>=G.q.length)return `<div class="card"><h2>🎮 完成!</h2><p style="font-size:22px">得分:${G.score} / ${G.q.length}</p><button onclick="gameInit();render()">再玩一次</button></div>`;
 const q=G.q[G.i];return `<div class="card"><h2>🎮 名家猜猜看 (${G.i+1}/${G.q.length})</h2><div class="tip">這句是模仿哪位作家的風格?(提示:比喻細膩→朱自清、溫柔感恩→冰心、簡練冷靜→魯迅、口語幽默→老舍、童真回憶→林海音)</div>
 <p style="font-size:20px;line-height:1.8">「${q[0]}」</p><div>${Object.keys(AU).map(n=>`<button class="opt" onclick="ans('${n}')">${n.replace('風格','')}</button>`).join('')}</div><p>得分:${G.score}</p></div>`}
let locked=false;
function ans(n){if(locked)return;locked=true;const q=G.q[G.i];if(n==q[1]){G.score++;toast('✅ 答對了!')}else toast('❌ 答案:'+q[1].replace('風格',''));G.i++;setTimeout(()=>{locked=false;render()},700)}
function setView(v){view=v;render();scrollTo(0,0)}
function copyEssay(){const t=T.title+'\n'+[1,2,3].map(secText).join('\n');if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('已複製!'),()=>alert('複製失敗,請手動選取'));else alert('此瀏覽器不支援複製,請手動選取')}
function go(d){cur=Math.max(0,Math.min(4,cur+d));save();render();scrollTo(0,0);setTimeout(cheer,300)}
function render(){CH=[];const a=document.getElementById('app'),tp=document.getElementById('top'),nav=document.getElementById('nav');
 if(view!='main'){tp.innerHTML='';nav.style.display='none';a.innerHTML=view=='sample'?sample():gameHTML();return}
 nav.style.display='';tp.innerHTML=topHTML();document.getElementById('nx').style.display=cur==4?'none':'';
 if(cur==0){const has=len(all())>0;a.innerHTML=`<div class="card"><h2>第1步:揀題目</h2>${has?'<div class="tip">💾 已載入你上次的進度。</div>':''}
 <div class="rm">📌 記得三個口訣:<br><b>時景心</b>(開頭)→ <b>開突果</b>(經過)→ <b>明決忘</b>(結尾)<br><button class="s" onclick="setView('sample')">先看示範範文</button></div>
 <h3>👉 點選一個題目(或自己填寫)</h3><div class="chips">${TOPICS.map((t,i)=>`<div class="topic ${T.title==t[0]?'sel':''}" onclick="pick(${i})">${t[0]}</div>`).join('')}</div>
 <p>我的題目:<input type="text" id="ti" placeholder="或自己寫題目" value="${T.title}" oninput="T.title=this.value;save();document.querySelectorAll('.topic').forEach(e=>e.classList.remove('sel'))"></p>
 <div class="tip" id="hint">💭 選好題目後,這裏會有提示。</div>
 <p>我的計劃(誰、何時、何地、什麼事、結果、感受):</p><textarea oninput="T.plan=this.value;save()">${T.plan}</textarea>
 <h3>⚙️ 支援選項</h3><label><input type="checkbox" ${simpleMode?'checked':''} onchange="simpleMode=this.checked;render()"> 簡易句子模式(句子較短,附英文翻譯 / Simple sentences with English)</label>
 <p class="ad">右下角的小助手會為你打氣,點牠或按「換小助手」可以更換!</p></div>`}
 else if(cur>=1&&cur<=3){const ps=P.filter(p=>p.sec==cur);if(!active||P.find(p=>p.k==active).sec!=cur)active=ps[0].k;
  a.innerHTML=`<div class="card"><h2>${steps[cur]}</h2><div class="tip">題目:${T.title||'(未選)'}。逐格寫,每格一至兩句,最後會自動合併成段。</div>
  <label><input type="checkbox" ${simpleMode?'checked':''} onchange="simpleMode=this.checked;render()"> 簡易句子模式(附英文)</label>
  ${ps.map((p,i)=>partHTML(p,(cur-1)*3+i+1)).join('')}${auHTML(cur)}<div class="chk" id="chk">${checkHTML(cur)}</div></div>`}
 else{const n=len(all());const segs=[1,2,3].map(secText);
  a.innerHTML=`<div class="card"><h2>第5步:完成與檢查</h2><h3 style="text-align:center">${T.title||'(未有題目)'}</h3>
  <div style="font-size:18px;line-height:2">${segs.map(x=>`<p>　　${x}</p>`).join('')}</div>
  <p class="cnt">總字數:<span class="${n>=400?'ok':''}">${n}</span> ${n>=400?'🎉 達標!':'(未夠400字,請補充)'}</p>
  <div class="chk">${checkHTML(0)}</div>
  <h3>✅ 自我檢查</h3>${["時:有時間、地點、人物","景:有環境描寫","心:有寫出心情","開:事情有清楚開始","突:有突發事件/高潮","果:有交代結果","明:我明白到……","決:我決定……","忘:我永不會忘記……","沒有錯別字、標點正確"].map(x=>`<label><input type="checkbox"> ${x}</label><br>`).join('')}
  <button onclick="copyEssay()">📋 複製文章</button><button class="g" onclick="window.print()">🖨 列印</button></div>`}}
showH();render();setTimeout(()=>say('你好!我是'+HELPERS[hi].n+',我會陪你一起寫作文!'),600);
</script></body></html>
