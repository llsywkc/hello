<style>
*{box-sizing:border-box}
body{margin:0;background:#fff5e4;color:#2f3a40;font:18px/1.85 system-ui,"Noto Sans TC","PingFang HK","Microsoft JhengHei",sans-serif}

 header,#topcard,.nav,#toast,button,.chips,.warnbox,.tip,details,.bar,.ck,select,.note{display:none!important}

<script>
const $=id=>document.getElementById(id);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3600)}
const cnt=s=>Array.from(s||'').filter(c=>!/[\s\p{P}]/u.test(c)).length;

/* ========== 資料 ========== */
const PERSONS=[
{t:'媽媽',e:'👩',h:'她',look:['{P}有一頭齊肩的短髮，笑起來時，眼睛彎成兩道月牙。','{P}個子不高，總是穿着簡單的衣服，看起來特別親切。','{P}的雙手有點粗糙，卻特別溫暖。','{P}的眼角有幾條細細的皺紋，那是她常常微笑留下的痕跡。','{P}說話時聲音輕柔，像春風一樣讓人安心。','{P}常常把頭髮梳成馬尾，看起來精神奕奕。']},
{t:'爸爸',e:'👨',h:'他',look:['{P}個子高大，肩膀寬闊，看起來十分可靠。','{P}有一雙濃密的眉毛，眼神堅定，笑起來時眼角擠出幾道皺紋。','{P}的皮膚被太陽曬得黝黑，手臂結實有力。','{P}戴着一副黑框眼鏡，看起來斯斯文文。','{P}的頭髮短短的，鬢角已經有幾根白髮。','{P}的聲音低沉而溫和，讓人覺得很安心。']},
{t:'老師',e:'🧑‍🏫',h:'她',look:['{P}戴着一副眼鏡，鏡片後的眼睛總是帶着笑意。','{P}留着一頭整齊的短髮，穿着乾淨的襯衫，看起來精神抖擻。','{P}個子不高，說話時常常微微彎下身子，望着我們的眼睛。','{P}的聲音清脆溫柔，講課時像說故事一樣動聽。','{P}的臉上常常掛着溫和的笑容，讓人如沐春風。','{P}手裏總是拿着一枝紅筆，隨時準備批改我們的功課。']},
{t:'同學',e:'🧒',h:'他',look:['{P}有一張圓圓的臉蛋，笑起來兩邊的酒窩若隱若現。','{P}個子雖然不高，卻總是精神奕奕，像一隻活力十足的小鳥。','{P}有一頭烏黑亮麗的短髮，一雙炯炯有神的眼睛。','{P}戴着一副圓圓的眼鏡，看起來十分斯文。','{P}的皮膚被太陽曬得黝黑，一看就知道是愛運動的人。','{P}笑起來眼睛彎成兩道月牙，讓人感到特別親切。']},
{t:'姐姐',e:'👧',h:'她',look:['{P}梳着一條長長的馬尾，走起路來一擺一擺的。','{P}有一雙明亮的大眼睛，笑起來像天上的星星。','{P}個子高挑，皮膚白皙，穿上校服顯得特別精神。','{P}戴着一副粉紅色的眼鏡，看起來十分斯文。','{P}的額前有幾縷劉海，認真做功課時總愛用手撥開。','{P}的聲音清脆，笑起來像銀鈴一樣悅耳。']},
{t:'爺爺',e:'👴',h:'他',look:['{P}滿頭白髮，臉上布滿皺紋，笑起來像一朵盛開的菊花。','{P}的雙手又粗又糙，那是一雙辛勤工作了幾十年的手。','{P}的背有點駝，走起路來慢悠悠的，卻十分穩重。','{P}戴着一副老花眼鏡，看報紙時總是瞇起眼睛。','{P}的聲音洪亮，說起往事時眼睛閃閃發亮。','{P}的眉毛已經花白，眉頭一皺，看起來有點嚴肅，其實心地很軟。']},
{t:'好朋友',e:'🤝',h:'她',look:['{P}有一雙彎彎的眼睛，笑起來像兩道小月牙。','{P}留着一頭烏黑的長髮，總愛用髮夾別在耳後。','{P}個子和我差不多高，笑起來時嘴角有兩個小酒窩。','{P}有一張白淨的臉，說話時總是輕聲細語。','{P}的皮膚有點黑，卻十分健康，一看就知道很喜歡運動。','{P}的笑聲爽朗，一聽就知道是她來了。']},
{t:'教練',e:'🏅',h:'他',look:['{P}身材高大魁梧，皮膚被太陽曬得黝黑。','{P}戴着一頂鴨舌帽，脖子上掛着一個哨子。','{P}的聲音洪亮有力，在球場上老遠都聽得見。','{P}有一雙銳利的眼睛，能一眼看出我們動作上的問題。','{P}穿着一身運動服，精神抖擻，看起來充滿活力。','{P}笑起來露出一口整齊的白牙，顯得十分親切。']}
];

const TRAITS=[
{w:'樂於助人',d:'看見別人有困難，會主動幫忙。',syn:['主動伸出援手','熱心','古道熱腸','雪中送炭'],
 open:['{P}是個樂於助人的人，不論誰有困難，{H}都會主動伸出援手。','在我心目中，{P}是個熱心的人，只要有人需要幫忙，{H}總是第一個站出來。'],
 endref:['{P}樂於助人的精神，深深感動了我，我真心欣賞{H}。','經過這些事，我更加肯定{P}是個樂於助人的人。'],
 lesson:['我明白了，幫助別人不一定要做大事，一句關心、一個小動作，也能帶來溫暖。','這些事讓我體會到，幫助別人的同時，自己的心也會感到快樂。'],
 action:['以後，看見同學有困難時，我會主動問他需不需要幫忙。','我也要像{P}一樣，做一個肯伸出援手的人。'],
 s:[
 {n:'幫我解決困難',cause:['那天放學，我忘記帶雨傘，站在校門口望着大雨不知怎麼辦。','有一次，我抱着一大疊簿子走向課室，走到樓梯口時，手臂已經痠得發抖。'],act:['{P}看見後，二話不說便走過來，把雨傘遞到我手中。','{P}主動接過一半的簿子，陪我一步一步走上樓梯。'],say:['{H}說：「拿着吧，我可以等一會再走。」','{H}笑着說：「別擔心，我們一起拿，很快就到了。」'],look:['{H}的眼神十分溫柔，嘴角微微上揚。','{H}額頭冒着汗，卻仍然輕鬆地向我笑了笑。'],psy:['我心想：「原來有人願意在我最需要的時候幫助我。」','我原本着急的心情漸漸平靜下來，心頭一暖。'],res:['最後，我平安回到家，也記住了這份善意。','我連忙道謝，{H}只是擺擺手說這是小事。']},
 {n:'幫助別人',cause:['小息時，我看見一位低年級的同學蹲在走廊角落，手裏拿着破了的書包。','有一次，我們在商場看見一個小朋友找不到爸媽，正站在原地哭。'],act:['{P}立刻蹲下來，拿出膠紙，小心翼翼地把書包黏好。','{P}輕輕牽着小朋友的手，帶他到服務台求助。'],say:['{H}輕聲說：「別怕，我們一起想辦法。」','{H}對小朋友說：「不用哭，我陪你等爸爸媽媽。」'],look:['{H}彎下腰，目光與他平視，臉上帶着安慰的笑容。','{H}眉頭微皺，不停望向四周，神情十分關切。'],psy:['看着這一幕，我心裏湧起一股暖流，也希望自己能這樣幫助別人。','我暗自佩服，心想：「換成是我，我會這樣主動嗎？」'],res:['不久，小朋友的家人趕來，連聲道謝，{H}卻只是微笑點頭。','書包修好後，那位同學破涕為笑，連聲說謝謝。']}]},
{w:'寬宏大量',d:'別人犯錯時，不計較，還會體諒對方。',syn:['不計前嫌','體諒','心胸開闊','以德報怨'],
 open:['{P}是個寬宏大量的人，即使別人犯了錯，{H}也不會斤斤計較。','{P}最特別的地方，就是遇到不愉快的事，總能一笑置之，是個寬宏大量的人。'],
 endref:['{P}寬宏大量，我十分欣賞{H}。','有{P}這樣寬宏大量的人在身邊，我感到特別安心。'],
 lesson:['我明白了，原諒別人，也是寬待自己。','這些事讓我體會到，體諒別人能使誤會更容易化解。'],
 action:['以後，同學不小心弄壞我的東西時，我會先聽他解釋，再一起想辦法補救。','我要學習{P}，遇到誤會時先冷靜，不隨便責怪別人。'],
 s:[
 {n:'我弄壞東西',cause:['美術課快完結時，我轉身拿膠水，不小心碰倒了水杯。','有一次，我借了{P}的筆，不小心把它弄斷了。'],act:['{P}先扶正水杯，再拿抹布細心地吸乾桌上的水。','{P}拿起斷了的筆看了看，然後把它放進筆盒，沒有露出責怪的表情。'],say:['{H}輕聲說：「沒關係，別着急，先把桌子擦乾吧。」','{H}笑着說：「不要緊，我還有另一枝筆呢！」'],look:['{H}嘴角仍然掛着一貫的微笑。','{H}眉頭只輕輕動了一下，隨即舒展開來。'],psy:['我緊握着雙手，心想：「{H}一定很生氣吧！」','我原本七上八落的心，一下子放鬆了。'],res:['我誠懇地道歉，也主動幫{H}收拾，心裏十分感激。','事情很快解決了，我們的關係反而更好。']},
 {n:'被人誤會',cause:['有一次，班長發現少了一本練習簿，便以為是{P}沒有交。','遊戲中我因為判斷錯誤，令{P}所在的一組輸了比賽。'],act:['{P}沒有立即反駁，只是走到桌旁仔細查看，終於找到夾在別的簿子裏的練習簿。','{P}拍拍我的肩膀，還主動幫我把比賽用具收拾好。'],say:['{H}平靜地說：「找到了就好，你也是想把工作做好。」','{H}笑着說：「輸了沒關係，我們下次再來一次。」'],look:['{H}沒有提高聲線，臉上仍然帶着微笑。','{H}雙眼彎彎的，沒有絲毫責怪的神情。'],psy:['我在一旁感到羞愧，心想：「剛才我真不應該誤會{H}。」','我心裏暗暗佩服：「換成是我，未必能這樣冷靜。」'],res:['誤會解開後，大家鬆了一口氣，氣氛也緩和下來。','我鼓起勇氣說了對不起，{H}只是笑着點點頭。']}]},
{w:'有耐心',d:'不急不躁，肯一次又一次地教導和等待。',syn:['不厭其煩','循循善誘','細心','慢慢來'],
 open:['{P}是個很有耐心的人，不論我問多少次，{H}都不會顯得不耐煩。','提起{P}，我首先想到的就是{H}的耐心，無論多麼困難的事，{H}都肯一步一步地教。'],
 endref:['{P}很有耐心，我十分欣賞{H}。','經過這些事，我更加明白{P}的耐心是多麼難得。'],
 lesson:['我明白了，耐心不只是等待，更是願意理解別人的困難，再換一個方法幫助對方。','這些事讓我體會到，別人的耐心可以給我們很大的勇氣。'],
 action:['以後，弟弟問我功課時，我會先問他哪裏不明白，再慢慢解釋，不會一開始便責怪他。','我也要學習{P}，用耐心去對待身邊的人。'],
 s:[
 {n:'教我功課',cause:['有一次，我遇到一道數學題，怎樣想也想不通。','我的作文只寫了幾句，不知道如何繼續，便拿着簿子去請教{P}。'],act:['{P}把椅子拉近，拿起筆，一步一步地把解題過程寫出來。','{P}拿出一張白紙，畫了幾個小格子，帶我整理事情的先後次序。'],say:['{H}輕聲說：「別急，我們先看第一步，好嗎？」','{H}溫柔地問：「那時候發生了甚麼事？他說了甚麼？」'],look:['{H}面帶微笑，眼神專注地看着我。','{H}沒有皺眉，只是微微點頭，示意我再試一次。'],psy:['我捏着衣角，心想：「我是不是很笨？」','看到{H}沒有不耐煩，我心裏的緊張減輕了不少。'],res:['經過{H}的引導，我終於明白了，臉上露出了笑容。','我寫出了完整的句子，也更有信心了。']},
 {n:'陪我練習',cause:['在練習朗讀時，我把同一句話讀錯了很多次，聲音越來越小。','學騎單車時，我一次又一次失去平衡，幾乎想放棄。'],act:['{P}沒有催促我，而是在句子中間畫上停頓記號，陪我一小段一小段地讀。','{P}跟在我身後，一隻手扶着單車，慢慢地向前走。'],say:['{H}鼓勵說：「這次前半句已經對了，我們再練後半句。」','{H}說：「慢慢來，每個人都是這樣學會的。」'],look:['{H}蹲下來看着我，臉上帶着溫和的笑容。','{H}額頭滲出汗珠，仍然不停向我點頭鼓勵。'],psy:['我低着頭，心裏想：「再讀錯，{H}會不會失去耐性？」','我暗下決心：不能辜負{H}的付出。'],res:['終於，我完整地讀完了一句，{H}高興地點頭。','過了一會，我終於成功騎出了一段路，興奮得大叫起來。']}]},
{w:'堅持不懈',d:'遇到困難不放棄，一直努力到成功。',syn:['鍥而不捨','持之以恆','堅毅不屈','永不放棄'],
 open:['{P}是個堅持不懈的人，遇到困難時，{H}從不輕易放棄。','提起{P}，我最佩服的就是{H}那股不服輸的毅力。'],
 endref:['{P}堅持不懈的精神，是我學習的榜樣。','我十分欣賞{P}，因為{H}總是堅持到底。'],
 lesson:['我明白了，堅持不是勉強自己一直做下去，而是不放棄，並願意檢討和改進方法。','這些事讓我體會到，失敗並不可怕，放棄才可怕。'],
 action:['以後，遇到難題時，我會先找出不明白的地方，嘗試不同方法，有需要時也會向老師請教。','我也要像{P}一樣，面對困難不輕易放棄。'],
 s:[
 {n:'練習運動',cause:['有一次，{P}為了準備跳繩比賽，在樓下不停練習。','學校要舉行長跑比賽，{P}每天清早便到公園練習。'],act:['{P}多次被繩子絆倒，卻只是拍拍衣服，重新握緊繩子再試。','{P}不論天氣多熱，都堅持把每一圈跑完，從不偷懶。'],say:['{H}喘着氣說：「再來一次，我一定可以做到！」','{H}對自己說：「再多跑一圈，不要放棄！」'],look:['{H}滿頭大汗，雙眼卻閃着堅定的光芒。','{H}咬緊牙關，眉頭緊鎖，仍然堅持向前。'],psy:['我在一旁看得心急，心想：「這麼辛苦，為甚麼不休息一會呢？」','我暗自佩服，心裏想：「{H}為甚麼這樣有毅力呢？」'],res:['終於，{H}成功連續跳了二十次，我們都高興得鼓掌。','比賽當天，{H}雖然未得冠軍，卻跑出了自己最好的成績。']},
 {n:'改進作品／練習',cause:['{P}做的紙橋總是歪向一邊，放上積木便倒下來。','{P}練習彈琴時，同一段旋律彈錯了十多次。'],act:['{P}拿尺量了量橋腳，發現兩邊高度不同，便重新剪好紙板再試。','{P}把樂譜放慢速度，逐個小節地練習，直到彈得準確為止。'],say:['{H}說：「知道原因就有機會改好，我想再試一次。」','{H}說：「失敗一次，就代表離成功近了一步。」'],look:['{H}皺着眉頭，眼睛緊盯着作品，十分專注。','{H}抿着嘴唇，雙手不停地調整細節。'],psy:['我心想：「做了這麼多次，還要再做嗎？」','我心裏暗暗感動，也想起自己放棄的時候。'],res:['這一次，紙橋穩穩地站着，{H}的雙眼一下子亮了起來。','完整彈完樂曲後，{H}終於鬆了一口氣，露出了滿足的笑容。']}]},
{w:'認真負責',d:'答應了的事一定做好，有始有終。',syn:['一絲不苟','盡忠職守','有始有終','說到做到'],
 open:['{P}是個認真負責的人，交給{H}的工作，{H}一定會做到最好。','{P}做事一絲不苟，答應了別人的事，從不馬虎，是個認真負責的人。'],
 endref:['{P}認真負責的態度，令我十分欣賞。','經過這些事，我更加相信{P}是個值得信賴的人。'],

 action:['以後，我答應別人的事，一定會準時完成。','我也要學習{P}，做事有始有終，不隨便推卸責任。'],
 s:[
 {n:'完成任務',cause:['那天輪到{P}負責一項重要的工作，大家都急着離開。','小息快完結時，大家都跑去玩，{P}卻留下來整理工作。'],act:['{P}把桌椅逐張排好，連角落的紙屑也撿起來。','{P}一項一項地核對清單，確定沒有遺漏才安心。'],say:['{H}認真地說：「這是我的責任，我一定要做好。」','{H}提醒大家：「請把自己的東西帶走，不要留下垃圾。」'],look:['{H}神情專注，眉頭微皺，目不轉睛地檢查每個細節。','{H}擦了擦額上的汗，臉上依然帶着認真的神情。'],psy:['我在旁邊看着，心想：「這麼晚了，為甚麼{H}還這樣認真？」','我暗自佩服，心裏想：「責任感就是這樣一件一件小事累積出來的。」'],res:['結果，一切都整理得井井有條，大家都稱讚{H}。','等一切完成後，{H}才安心地離開。']},
 {n:'說到做到',cause:['{P}答應幫我找一本舊書，我以為只是隨口說說。','{P}答應星期日陪我練習，那天卻下着大雨。'],act:['第二天，{P}真的把書帶來了，還在書頁上貼了小標籤。','{P}撐着傘，準時出現在約定的地方。'],say:['{H}笑着說：「答應了的事，我一定會做到。」','{H}說：「我既然答應了你，就不能失約。」'],look:['{H}的衣服被雨打濕了，臉上卻帶着準時赴約的笑容。','{H}把書遞給我時，眼神十分真誠。'],psy:['我心頭一暖，原來被人重視是這樣的感覺。','我心想：「我也要成為一個說到做到的人。」'],res:['那天我們練習得十分順利，我也學會了守信的重要。','我小心地收好那本書，更加珍惜這份友情。']}]},
{w:'勤奮好學',d:'肯花時間學習，遇到不明白就去問。',syn:['孜孜不倦','廢寢忘食','不恥下問','好學不倦'],
 open:['{P}是個勤奮好學的人，總是不斷追求進步。','提起{P}，我最佩服的是{H}肯用功、肯發問的學習態度。'],
 endref:['{P}勤奮好學的精神，是我學習的榜樣。','我十分欣賞{P}，因為{H}從不停止學習。'],
 lesson:['我明白了，只要肯努力，每個人都能進步。','這些事讓我體會到，不明白的地方要勇敢發問，不懂也不要怕丟臉。'],
 action:['以後，我會每天抽時間閱讀，遇到不明白的地方就請教老師。','我也要像{P}一樣，把錯題記下來，認真改正。'],
 s:[
 {n:'用功讀書',cause:['小息時，同學們都在操場玩耍，{P}卻坐在圖書館裏看書。','晚上我起牀喝水，發現{P}房間的燈仍然亮着。'],act:['{P}專心地閱讀，還不時拿起筆，把重點抄在小簿子上。','{P}翻開字典，把不認識的字一個一個查清楚。'],say:['我問{H}為甚麼這樣用功，{H}笑着說：「今天多學一點，明天就會進步一點。」','{H}說：「不明白的地方，現在弄清楚，以後才不會忘記。」'],look:['{H}雙眉微皺，眼睛專注地盯着書本。','{H}戴着眼鏡，不時用手托一托，神情十分專注。'],psy:['我心裏想：「原來{H}的成績好，是因為付出了這麼多努力。」','我有點慚愧，想起自己常常偷懶。'],res:['後來我也學着{H}，每天抽空閱讀。','考試成績公布時，{H}進步了不少，我由衷為{H}高興。']},
 {n:'發問和改錯',cause:['課堂上，老師講解了一個難題，大部分人都低頭不作聲。','{P}發現自己做錯了題目，沒有把它放在一旁。'],act:['{P}舉起手，認真地向老師請教，還把答案記在筆記上。','{P}把錯題抄在改錯簿上，再寫上正確做法。'],say:['{H}說：「老師，我還有一個地方不明白，可以再講一次嗎？」','{H}笑着說：「錯題是最好的老師。」'],look:['{H}挺直身子，眼睛閃着求知的光芒。','{H}微微皺眉，筆尖在紙上不停地移動。'],psy:['我心想：「發問需要勇氣，{H}真勇敢。」','我暗自反省，覺得自己常常怕丟臉而不敢發問。'],res:['最後{H}弄明白了，臉上綻開了滿足的笑容。','我學着{H}把錯題記下來，之後少犯了許多錯誤。']}]},
{w:'風趣幽默',d:'愛說笑，能令身邊的人開心。',syn:['妙語如珠','逗人發笑','開朗','笑口常開'],
 open:['{P}是個風趣幽默的人，總能令身邊的人開懷大笑。','{P}最特別的地方，就是說話有趣，總有辦法把氣氛變得輕鬆。'],
 endref:['{P}風趣幽默，令人難忘，我十分欣賞{H}。','有{P}在的地方，總是充滿笑聲。'],
 lesson:['我明白了，快樂是可以傳染的，一個笑容也能令別人心情變好。','這些事讓我體會到，幽默不是取笑別人，而是讓大家都開心。'],
 action:['以後，看見同學不開心，我會試着說些有趣的事逗他笑。','我也要學習{P}，用笑容面對生活中的困難。'],
 s:[
 {n:'逗大家開心',cause:['有一次考試後，全班都垂頭喪氣，課室裏安靜得沒有一點聲音。','那天下雨，我因為不能出去玩，一直悶悶不樂。'],act:['{P}突然站起來，模仿卡通人物走路，逗得我們哈哈大笑。','{P}把雨傘當成魔法棒，在空中揮來揮去，扮演起魔法師。'],say:['{H}擠眉弄眼地說：「別難過，煩惱就像這場雨，很快就停了！」','{H}大聲宣布：「現在是笑話時間，不笑的人要罰笑三次！」'],look:['{H}眨眨眼，嘴角帶着一絲調皮的笑容。','{H}瞪大了眼睛，裝出誇張的表情。'],psy:['我原本沉重的心情一下子輕鬆起來，不禁暗自佩服。','我心想：「原來快樂是可以傳染的。」'],res:['不一會兒，整間課室都充滿了笑聲。','我笑得肚子都痛了，煩惱也忘得一乾二淨。']},
 {n:'化解尷尬',cause:['我在同學面前不小心說錯了一句話，臉頓時漲得通紅。','聚會中，大家因為一件小事爭了起來，氣氛變得很緊張。'],act:['{P}拍拍我的肩膀，故意用誇張的語氣把話重複了一遍，惹得大家哄堂大笑。','{P}拿出自己的小玩意兒，扮成主持人，為大家緩和氣氛。'],say:['{H}笑着說：「說錯話不要緊，我昨天更離譜呢！」','{H}大聲說：「來，爭吵時間結束，大家一起來吃點心！」'],look:['{H}雙眼彎彎的，笑容可掬。','{H}故意皺起眉頭，又突然咧嘴大笑。'],psy:['我臉上的熱度漸漸退去，心裏十分感激。','我心想：「幽默不是取笑別人，而是讓大家都開心。」'],res:['尷尬的氣氛頓時消失了，大家又重新玩在一起。','我終於放鬆下來，也和大家一起笑了。']}]},
{w:'細心體貼',d:'留意別人的心情和需要，默默關心。',syn:['無微不至','善解人意','體貼入微','關懷備至'],

 action:['以後，我會多留意身邊的人，發現他們不開心時，主動陪伴他們。','我也要像{P}一樣，用小小的行動關心別人。'],
 s:[
 {n:'發現我不開心',cause:['有一天，我因為考試失敗，一整天都沒有說話。','那天我在學校和朋友吵架了，回到家後悶悶不樂。'],act:['{P}沒有追問，只是悄悄地倒了一杯熱茶放在我桌旁。','{P}坐到我身旁，靜靜地陪着我，沒有說太多話。'],say:['{H}輕聲說：「如果你想說，我隨時都在聽。」','{H}溫柔地說：「今天辛苦了，先休息一下吧。」'],look:['{H}的眼神裏滿是關切，輕輕拍了拍我的背。','{H}微微彎下身子，語氣柔和。'],psy:['我鼻子一酸，心裏湧起一股暖流。','我心想：「原來有人一直默默留意着我。」'],res:['過了一會，我終於把心事說出來，心情輕鬆了許多。','那天晚上，我睡得特別安穩。']},
 {n:'留意小細節',cause:['冬天來了，我常常忘記帶外套，手也凍得通紅。','我最近熬夜做功課，眼睛看起來有點紅腫。'],act:['第二天，{P}悄悄把一雙手套放進我的書包。','{P}提醒我要早點休息，還幫我把明天需要的東西整理好。'],say:['{H}微笑着說：「天氣冷了，記得保暖。」','{H}輕聲說：「眼睛要休息，功課明天再做也可以。」'],look:['{H}看着我，眼角帶着一絲心疼。','{H}眉頭微皺，語氣中帶着擔心。'],psy:['我心頭一暖，原來被人記掛是這樣幸福。','我暗自決心：以後也要細心留意身邊的人。'],res:['戴上手套的一刻，我的手暖了，心也暖了。','我聽從{H}的話早點休息，第二天精神好多了。']}]}
];

}
function go(i){
 if(i>1&&(S.person===null||S.trait===null)){toast('請先選人物和性格');i=S.person===null?0:1}
 if(i>S.step&&i>1){
  for(let j=Math.max(S.step,2);j<i;j++){
   const st=STEPS[j];if(st.k==='final')continue;const d=DEF[st.k];
   if(d.opt)continue;
   if(!(S.text[tkey(st)]||'').trim()){toast('請先完成「'+st.part+'：'+d.t+'」（不知道怎樣寫，可按「加入」句子再修改）');i=j;break}
  }
 }
 S.step=Math.max(0,Math.min(STEPS.length-1,i));save();render();window.scrollTo(0,0);afterRender()
}

/* ========== 畫面 ========== */
function afterRender(){
 const h=document.querySelector('#stage h2');if(h){h.setAttribute('tabindex','-1');try{h.focus({preventScroll:true})}catch(e){}}
}
function render(){
 updateProgress();$('jump').value=S.step;
 const st=STEPS[S.step],root=$('stage');root.innerHTML='';
 if(st.k==='person')return renderPerson(root);
 if(st.k==='trait')return renderTrait(root);
 if(st.k==='final')return renderFinal(root);
 renderWrite(root,st);
}
function navBar(root,canNext,opt,nextFn){
 const n=el('div','nav');
 const back=el('button','','◀ 上一步');back.disabled=S.step===0;back.onclick=()=>go(S.step-1);
 const mid=el('span');
 if(opt){const sk=el('button','','⏭ 跳過這步');sk.onclick=()=>go(S.step+1);mid.appendChild(sk)}
 const nx=el('button','primary','下一步 ▶');nx.onclick=()=>{ if(nextFn&&!nextFn())return; go(S.step+1)};
 n.append(back,mid,nx);root.appendChild(n);
}
function renderPerson(root){
 const c=el('div','card');c.appendChild(el('h2','','第一步：選你欣賞的人'));
 c.appendChild(el('div','note','先選一個你最了解的人。選一個你有真實故事可以寫的人，會寫得更好。'));
 const g=el('div','grid');
 PERSONS.forEach((p,i)=>{const b=el('button','big'+(S.person===i?' on':''),'');b.innerHTML=p.e+'<br>'+p.t;b.setAttribute('aria-pressed',S.person===i?'true':'false');b.onclick=()=>{if(S.person!==i){if(hasContent()){if(!confirm('改變人物會清除已經寫好的內容，確定嗎？'))return;resetContent()}S.person=i;S.name=p.t;S.pron=p.h;S.title=p.t;autoScen()}save();render()};g.appendChild(b)});
 c.appendChild(g);
 if(S.person!==null){
  const box=el('div','tip');
  box.appendChild(el('div','','稱呼（可以改成名字，例如「陳老師」「小明」）：'));
  const inp=el('input');inp.type='text';inp.value=S.name;inp.setAttribute('aria-label','稱呼');inp.oninput=()=>{S.name=inp.value.trim();S.title=S.name;invalidateFin();save()};
  box.appendChild(inp);
  const ps=el('select');ps.setAttribute('aria-label','他或她');['他','她'].forEach(x=>{const o=el('option','',x);o.value=x;ps.appendChild(o)});ps.value=S.pron;ps.onchange=()=>{S.pron=ps.value;invalidateFin();save()};
  box.appendChild(el('span','','　代詞：'));box.appendChild(ps);
  c.appendChild(box);
 }
 root.appendChild(c);
 navBar(root,true,false,()=>{if(S.person===null){toast('請先選一個人物');return false}if(!S.name){S.name=PERSONS[S.person].t;save()}return true});
}
function renderTrait(root){
 const c=el('div','card');c.appendChild(el('h2','','第二步：選你要寫的性格'));
 c.appendChild(el('div','note','你要寫「'+(S.name||'他／她')+'」是個怎樣的人？選一個性格，全篇都要圍繞它：外貌、事件、結尾都要為這個性格服務。'));
 const g=el('div','grid');
 TRAITS.forEach((t,i)=>{const b=el('button','big'+(S.trait===i?' on':''),'');b.innerHTML=t.w+'<small>'+t.d+'</small>';b.setAttribute('aria-pressed',S.trait===i?'true':'false');b.onclick=()=>{if(S.trait!==i){if(hasContent()){if(!confirm('改變性格會清除已經寫好的內容，確定嗎？'))return;resetContent()}S.trait=i;autoScen()}save();render()};g.appendChild(b)});
 c.appendChild(g);
 if(S.trait!==null){const t=TRAITS[S.trait];c.appendChild(el('div','tip','你選了：「'+t.w+'」。相近的詞語：'+t.syn.join('、')+'。'))}
 root.appendChild(c);
 navBar(root,true,false,()=>{if(S.trait===null){toast('請先選一個性格');return false}return true});
}
function limitedRows(parent,items,n){
 items.slice(0,n).forEach(x=>parent.appendChild(sentRow(x)));
 if(items.length>n){const more=el('div');more.style.display='none';items.slice(n).forEach(x=>more.appendChild(sentRow(x)));
  const b=el('button','moreBtn','▼ 看更多句子（還有 '+(items.length-n)+' 句）');b.setAttribute('aria-expanded','false');
  b.onclick=()=>{const open=more.style.display==='none';more.style.display=open?'block':'none';b.textContent=open?'▲ 收起':'▼ 看更多句子（還有 '+(items.length-n)+' 句）';b.setAttribute('aria-expanded',open?'true':'false')};
  parent.append(b,more)}
}
function causeStepIndex(e){return STEPS.findIndex(x=>x.k==='cause'&&x.e===e)}
function renderWrite(root,st){
 const d=DEF[st.k],key=tkey(st),trait=TRAITS[S.trait],pi=partIndex(st);
 S.words=S.words||{};S.words[key]=S.words[key]||[];
 const e=st.e,sg=e?storyOf(e):0,sgn=STORYN[sg];
 const c=el('div','card');
 const L=el('div','left'),R=el('div','right'),tw=el('div','twocol');tw.append(L,R);
 const h=el('h2');
 h.appendChild(el('span','badge',st.part));
 if(d.opt)h.appendChild(el('span','badge opt','加分'));
 h.appendChild(document.createTextNode(d.t));c.appendChild(h);
 c.appendChild(el('div','note','📌 任務：'+fill(d.task)));
 if(st.k==='cause'){
  const sc=el('div','tip');sc.appendChild(el('div','','先選「事件'+e+'」的情境：'));
  const chs=el('div','chips');
  trait.s.forEach((s,i)=>{const on=S.scen[e-1]===i;const b=el('button','chip',s.n+(fitOK(S.trait,i)?'':' ⚠'));b.setAttribute('aria-pressed',on?'true':'false');
   b.onclick=()=>{if(S.scen[e-1]===i)return;
    if(hasEvent(e)){if(!confirm('改變情境會清除「事件'+e+'」已經寫好的內容，確定嗎？'))return;clearEvent(e)}
    const oi=e===1?1:0;if(S.scen[oi]===i)S.scen[oi]=S.scen[e-1];S.scen[e-1]=i;S.story[e-1]=0;save();render()};chs.appendChild(b)});
  sc.appendChild(chs);
  if(!fitOK(S.trait,S.scen[e-1])){sc.appendChild(el('div','warnbox','⚠ 這個情境比較適合寫「'+fitNames(S.trait,S.scen[e-1])+'」。你的人物是「'+S.name+'」，請只借用寫法，並按真實經歷改寫人物、地點和事情。'))}
  sc.appendChild(el('div','muted','提醒：事件一和事件二要用不同情境，但都要表現「'+trait.w+'」。'));
  c.appendChild(sc);
  const sb=el('div','stepbox');
  sb.appendChild(el('h3','','這個情境有兩個故事，請選一個（之後的步驟會跟着這個故事走）'));
  const scn=sceneOf(e);
  [0,1].forEach(i=>{const b=el('button','storybtn','故事'+STORYN[i]+'：'+fill(scn.cause[i]));b.setAttribute('aria-pressed',sg===i?'true':'false');
   b.onclick=()=>{if(storyOf(e)===i)return;
    if(hasEvent(e)){if(!confirm('改選故事會清除「事件'+e+'」已經寫好的內容，確定嗎？'))return;clearEvent(e)}
    S.story[e-1]=i;save();render()};sb.appendChild(b)});
  sb.appendChild(el('div','muted','你也可以只借用句子的寫法，寫自己真實的經歷。'));
  c.appendChild(sb);
 } else if(e){
  const bn=el('div','tip');
  bn.appendChild(document.createTextNode('📖 你選的是「事件'+e+'・'+sceneOf(e).n+'・故事'+sgn+'」。以下句子都來自這個故事。'));
  const cb=el('button','','↩ 改選故事');cb.style.marginLeft='8px';cb.onclick=()=>go(causeStepIndex(e));bn.appendChild(cb);
  c.appendChild(bn);
 }
 const tray=el('div','tray');
 function renderTray(){
  tray.innerHTML='';
  tray.appendChild(el('b','','📌 我收藏的好詞：'));
  const ws=S.words[key];
  if(!ws.length)tray.appendChild(el('span','muted','（還沒有。在①按一下喜歡的詞語。）'));
  else{const row=el('div','chips');ws.forEach(w=>{const b=el('button','',w+' ✕');b.setAttribute('aria-label','取消收藏 '+w);b.onclick=()=>{S.words[key]=S.words[key].filter(x=>x!==w);save();renderTray();syncWords()};row.appendChild(b)});tray.appendChild(row)}
 }
 const wordBtns=[];
 function syncWords(){wordBtns.forEach(([w,b])=>b.setAttribute('aria-pressed',S.words[key].includes(w)?'true':'false'))}
 const s1=el('div','stepbox');
 s1.appendChild(el('h3','','① 先揀好詞（按一下收藏，寫的時候可以用上）'));
 const wrow=el('div','chips');
 WD[d.w].forEach(w=>{const b=el('button','',w);b.setAttribute('aria-pressed',S.words[key].includes(w)?'true':'false');
  b.onclick=()=>{const a=S.words[key];if(a.includes(w))S.words[key]=a.filter(x=>x!==w);else S.words[key]=a.concat([w]);save();renderTray();syncWords()};
  wordBtns.push([w,b]);wrow.appendChild(b)});
 s1.appendChild(wrow);L.appendChild(s1);
 let ex=[],other=[];
 if(st.k==='open')ex=trait.open;
 else if(st.k==='look')ex=PERSONS[S.person].look;
 else if(st.k==='endref')ex=trait.endref;
 else if(st.k==='endlesson')ex=trait.lesson;
 else if(st.k==='endaction')ex=trait.action;
 else{const arr=sceneOf(e)[d.key];ex=[arr[sg]];other=[arr[1-sg]]}
 const s2=el('div','stepbox');
 s2.appendChild(el('h3','','② 再揀句子（每句都是完整的句子，按「加入」後，改成自己的內容）'));
 const g1=det(e?'💡 故事'+sgn+'的句子':'💡 配合你的人物和性格的句子',true);
 limitedRows(g1,ex.map(x=>fill(x)),4);
 g1.appendChild(el('div','muted','句子不一定完全貼合你的人物，請按真實經歷修改人名、事件和細節。'));
 s2.appendChild(g1);
 const poolKey=d.pool||(st.k==='say'?'say':null);
 const more=(GEN[st.k]||[]).concat(poolKey&&POOL[poolKey]?POOL[poolKey]:[]).map(x=>fill(x));
 if(more.length){const g2=det('📚 更多完整句子（任何故事都可以用）',false);limitedRows(g2,more,6);s2.appendChild(g2)}
 if(other.length){const g3=det('↔ 另一個故事（故事'+STORYN[1-sg]+'）的寫法：只作參考，不要和故事'+sgn+'混在一起',false);other.forEach(x=>g3.appendChild(sentRow(fill(x))));s2.appendChild(g3)}
 L.appendChild(s2);
 R.appendChild(el('h3','','③ 最後寫出來（把句子改成自己的，並用上收藏的好詞）'));
 R.appendChild(tray);renderTray();
 const ta=el('textarea');ta.id='cur';ta.value=S.text[key]||'';ta.setAttribute('aria-label',d.t);
 const info=el('div','muted');
 const pv=el('div','preview');
 function refresh(){info.textContent='這一步 '+cnt(ta.value)+' 字';pv.textContent=assemble(pi)||'（這一段還沒有內容）'}
 ta.oninput=()=>{S.text[key]=ta.value;invalidateFin();save();refresh()};
 R.append(ta,info);
 CURPOS=null;['keyup','click','blur','select','input','touchend'].forEach(ev=>ta.addEventListener(ev,()=>{CURPOS=ta.selectionStart}));
 R.appendChild(el('h3','','👀 「'+st.part+'」目前的內容'));R.appendChild(pv);refresh();
 c.appendChild(tw);root.appendChild(c);
 navBar(root,true,!!d.opt,()=>{if(!d.opt&&!(S.text[key]||'').trim()){toast('先寫一兩句再下一步（不知道怎樣寫，可按「加入」句子再修改）');return false}return true});
}
function renderFinal(root){
 const c=el('div','card');c.appendChild(el('h2','','最後：整理全文'));
 c.appendChild(el('div','note','下面是你剛才寫的內容，已經自動分段。請逐段朗讀，修改不通順的地方，然後檢查錯別字和標點。'));
 const ti=el('input');ti.type='text';ti.value=S.title||S.name;ti.setAttribute('aria-label','題目人物');
 const tl=el('div','');tl.appendChild(document.createTextNode('題目：《一位我欣賞的'));tl.appendChild(ti);tl.appendChild(document.createTextNode('》'));
 ti.oninput=()=>{S.title=ti.value;save()};c.appendChild(tl);
 const names=['開首','事件一','事件二','結尾'];
 if(!S.fin){S.fin=[0,1,2,3].map(assemble);S.finEdited=false;S.stale=false}
 if(S.stale){const wb=el('div','warnbox','');wb.appendChild(el('div','','⚠ 你在前面的步驟修改了內容，但這頁因為你已經自己改過，所以沒有自動更新。'));const rb=el('button','','🔄 重新合併前面步驟的內容（會覆蓋這頁的修改）');rb.onclick=()=>{if(confirm('這頁的修改會被覆蓋，確定嗎？')){S.fin=null;S.finEdited=false;S.stale=false;save();render()}};wb.appendChild(rb);c.appendChild(wb)}
 const tas=[];const tot=el('div','');
 function upd(){S.fin=tas.map(t=>t.value);save();const n=cnt(S.fin.join(''));tot.innerHTML='<b>總字數：'+n+' / 330</b>'+(n>=330?' ✅':'');
  const bar=$('wb');if(bar){bar.style.width=Math.min(100,n/330*100)+'%'}
  const nb=S.fin.reduce((a,v)=>a+blanks(v),0);const bw2=$('blankWarn');
  if(bw2){bw2.style.display=(nb>0||n===0)?'block':'none';bw2.textContent=n===0?'⚠ 你還沒有寫任何內容。請回到前面的步驟，從「開首」開始寫。':'⚠ 全文還有 '+nb+' 處「＿＿」沒有填寫。請把它們改成自己的內容，或刪除整句。'}
  const ck2=$('chkBox');if(ck2){const tp=checkText(S.fin);ck2.style.display=tp.length?'block':'none';ck2.innerHTML='';if(tp.length){ck2.appendChild(el('b','','🔎 小提醒（電腦自動檢查，未必全對）'));tp.forEach(x=>ck2.appendChild(el('div','',' • '+x)))}}
  const miss=[];
  if(!(S.text.expr1||'').trim())miss.push('事件一神態描寫');if(!(S.text.psy1||'').trim())miss.push('事件一心理描寫');
  if(!(S.text.expr2||'').trim())miss.push('事件二神態描寫');if(!(S.text.psy2||'').trim())miss.push('事件二心理描寫');
  $('hint').textContent=n<330?'還差 '+(330-n)+' 字。可以回到「加分步驟」補寫：'+(miss.join('、')||'每一步多加一句例子或對話')+'。':'字數已經足夠，請集中檢查是否通順。';
 }
 names.forEach((nm,i)=>{c.appendChild(el('h3','',(i+1)+'. '+nm));const t=el('textarea');t.value=S.fin[i]||'';t.style.minHeight='120px';t.oninput=()=>{S.finEdited=true;upd()};t.setAttribute('aria-label',nm);tas.push(t);c.appendChild(t)});
 c.appendChild(tot);
 const bw=el('div','bar');bw.innerHTML='<div id="wb"></div>';c.appendChild(bw);
 const bwn=el('div','warnbox');bwn.id='blankWarn';bwn.style.display='none';c.appendChild(bwn);
 const ckb=el('div','tip');ckb.id='chkBox';ckb.style.display='none';c.appendChild(ckb);
 const hint=el('div','tip');hint.id='hint';c.appendChild(hint);
 c.appendChild(el('h3','','✅ 自我檢查'));
 ['我有寫外貌描寫，具體描述人物的樣子。','我有運用行為、語言描寫，表現人物性格。（有神態、心理描寫更好）','我的開首有介紹人物是個怎樣的人。','兩件事都能證明同一個性格。','我的結尾與開首呼應，並寫出感受、啟示或期望。','我已讀過全文，檢查錯別字和標點。'].forEach(x=>{const l=el('label','ck');const cb=el('input');cb.type='checkbox';l.appendChild(cb);l.appendChild(document.createTextNode(' '+x));c.appendChild(l)});
 const act=el('div','chips');
 function guard(){const nb=tas.reduce((a,x)=>a+blanks(x.value),0);return nb===0||confirm('全文還有 '+nb+' 處「＿＿」沒有填寫，仍然要繼續嗎？')}
 function full(){return '《一位我欣賞的'+(ti.value||S.name)+'》\n\n'+tas.map(t=>t.value).join('\n\n')}
 const b1=el('button','primary','📋 複製全文');b1.onclick=()=>{if(!guard())return;navigator.clipboard&&navigator.clipboard.writeText(full());toast('已複製')};
 const b2=el('button','','💾 匯出文字檔');b2.onclick=()=>{if(!guard())return;const u=URL.createObjectURL(new Blob([full()],{type:'text/plain;charset=utf-8'}));const a=el('a');a.href=u;a.download='我欣賞的人.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800)};
 const b3=el('button','','🔄 重新開始');b3.onclick=()=>{if(confirm('確定清除全部內容並重新開始？')){S={step:0,person:null,name:'',pron:'她',trait:null,scen:[0,1],story:[0,0],text:{},words:{},fin:null,title:'',finEdited:false,stale:false};save();render()}};
 act.append(b1,b2,b3);c.appendChild(act);
 c.appendChild(el('p','muted','草稿只保存在這部 iPad 的瀏覽器內，不會上傳。Safari 一星期沒有使用，草稿可能被清除，請定期按右上角「備份」，或用「加入主畫面」開啟。'));
 root.appendChild(c);upd();
 navBar(root,false,false,null);
 const nb=root.querySelector('.nav button.primary');if(nb)nb.remove();
}
function lastBk(){return localStorage.getItem('zw_last_backup')}
function showBk(){const v=lastBk();$('bkt').textContent=v?'上次備份：'+new Date(Number(v)).toLocaleDateString('zh-HK'):'未備份'}
$('bk').onclick=()=>{
 const parts=[0,1,2,3].map(assemble);const txt=(S.finEdited&&S.fin?S.fin:parts).join('\n\n');
 if(!txt.trim()){toast('還沒有內容可以備份');return}
 const u=URL.createObjectURL(new Blob(['《一位我欣賞的'+(S.title||S.name||'')+'》\n\n'+txt],{type:'text/plain;charset=utf-8'}));
 const a=el('a');a.href=u;a.download='作文備份.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),800);
 try{localStorage.setItem('zw_last_backup',String(Date.now()))}catch(e){}showBk();toast('已備份。iPad 請按「儲存到檔案」');
};
showBk();
buildJump();render();afterRender();
