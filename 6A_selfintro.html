 h+=MAP.map(m=>{const ok=stepFilled(m.step);return '<button class="node '+m.cls+(ok?' ok':'')+'" data-act="gostep" data-i="'+m.step+'"><span class="no">'+m.no+'</span>'+m.t+'<span class="st">'+(ok?'✔ 已填寫':'去填寫 →')+'（步驟 '+steps[m.step].n+'）</span></button>'}).join('');
 h+='<div class="c">我自己</div></div>';
 h+='<div class="q">更多可以加入的內容</div><div class="more">'+MORE.map(i=>'<button class="chip'+(stepFilled(i)?' sel':'')+'" data-act="gostep" data-i="'+i+'">'+steps[i].n+' '+esc(steps[i].t)+(steps[i].opt?'（選填）':'')+'</button>').join('')+'</div>';
 h+='<div class="note">建議次序：先設定第 ① 步的面試時間，再按導圖由 ② 開始逐步完成。</div>';
 h+='<div class="nav"><span></span><button class="btn p" data-act="gostep" data-i="0">從第 ① 步開始 →</button></div>';
 $('card').innerHTML=h;
}
function renderStep(){
 const s=steps[ui.cur],tabs=tabList(ui.cur);
 if(ui.tab>=tabs.length)ui.tab=0;
 const name=tabs[ui.tab];
 let h='<h2>'+s.n+' '+esc(s.t)+(s.opt?'（選填）':'')+'</h2><div class="sub2">'+esc(s.w)+'</div>';
 if(s.opt)h+='<div class="optb">📎 選填段落：不填就會自動略去；填了之後，會因應你設定的時間而包括或略去較長的句子。</div>';
 h+='<div class="tabs">'+tabs.map((t,i)=>'<button class="'+(i==ui.tab?'on':'')+'" data-act="tab" data-i="'+i+'">'+esc(t)+'</button>').join('')+'</div>';
 if(ui.tab==0)h+='<details class="think"><summary>🤔 先想一想（不用寫出來）</summary>'+s.ask.map(a=>'<div>• '+esc(a)+'</div>').join('')+'</details>';
 if(name=='追問')h+='<div class="q" style="margin-top:0">🔎 '+esc(s.probe.q)+'</div><div class="hint">寫了會令你的自我介紹更獨特，可留空。</div><textarea class="pr" data-bindpr="'+s.probe.k+'" placeholder="'+esc(s.probe.ph)+'">'+esc(S.pr[s.probe.k])+'</textarea>';
 else if(name=='揀句式')h+='<div id="patbox">'+patHTML()+'</div>';
 else if(name==s.customTab)h+=lenHTML();
 else h+=tabQs(ui.cur,name).map(qHTML).join('');
 const b=blocker(ui.cur,name);
 if(b)h+='<div class="warn" style="margin-top:16px">⚠️ '+esc(b)+'</div>';
 const last=ui.cur==FINAL-1&&ui.tab==tabs.length-1;
 h+='<div class="nav"><button class="btn s" data-act="prev">'+(ui.cur==0&&ui.tab==0?'← 返回導圖':'← 返回')+'</button><button class="btn p" data-act="next">'+(last?'完成，去修改和練習 ✨':(ui.tab==tabs.length-1?(s.opt?'下一個步驟（可略過）→':'下一個步驟 →'):'繼續 →'))+'</button></div>';
 $('card').innerHTML=h;
}
function draft(){return paras(false).filter(p=>p.sents.length).map(p=>p.sents.map(x=>x.text).join('')).join('\n\n')}
function keywords(){
 const k=[];
 if(S.trait.length)k.push(['他人眼中',S.trait.join('・')]);
 if(S.selfTrait.length)k.push(['我的性格',S.selfTrait.join('・')]);
 if(S.interest.length)k.push(['興趣',S.interest.join('・')]);
 if(S.subject)k.push(['最喜歡的科目',S.subject]);
 if(S.homeDo.length||S.holiDo.length)k.push(['在家和假期',[].concat(S.homeDo,S.holiDo).join('・')]);
 if(S.evWhat||S.evType)k.push(['故事',S.evWhat||S.evType]);
 if(S.diff)k.push(['困難',S.diff]);
 if(S.act)k.push(['克服',S.act]);
 if(S.lesson)k.push(['體會',S.lesson]);
 if(S.gType)k.push(['校園故事',S.gType]);
 if(S.hAct)k.push(['課外活動',S.hAct]);
 if(S.compType)k.push(['比賽／交流',S.compType]);
 if(S.iWho)k.push(['影響我的人',S.iWho]);
 if(S.strength.length)k.push(['優點',S.strength.join('・')]);
 if(S.weak)k.push(['缺點',S.weak]);
 if(S.fix)k.push(['改善',S.fix]);
 if(S.ms||S.reasons.length)k.push(['想讀的中學',S.ms||S.reasons.join('・')]);
 if(S.dream)k.push(['志願',S.dream]);
 if(S.goalHow)k.push(['怎樣達成',S.goalHow]);
 return k;
}
const CHECK=['聲音夠大聲、清楚','望着「老師」，不是望地下','語速適中，沒有趕','沒有背稿的「讀書語氣」','有微笑','在自己訂的時間內完成','故事部分有加入自己的細節','結尾有停頓，並有禮貌地道謝'];
let timer=null,secs=0,dur=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderFinal(){
 if(S.ta===null)S.ta=draft();
 if(dur===null)dur=Math.round(S.mins*60);
 let h='<h2>✍️ 修改和練習</h2><div class="sub2">目前設定：'+(S.mins?S.mins+' 分鐘（約 '+targetChars()+' 字）':'不限時間')+(S.ms?'・'+esc(S.ms):'')+'。想改長短，可回到第 ① 步設定時間。</div>';
 h+='<div class="tabs">'+FTABS.map((t,i)=>'<button class="'+(i==ui.ftab?'on':'')+'" data-act="ftab" data-i="'+i+'">'+t+'</button>').join('')+'</div>';
 const t=FTABS[ui.ftab];
 if(t=='初稿'){
  h+='<div class="hint">每句旁邊：🔄 換另一種句式，🗑 刪走這句。滿意後，到「修改版」用自己的説話改寫。</div><div class="out">';
  paras(false).forEach(p=>{if(!p.sents.length)return;
   h+='<div class="pc"><h4>'+esc(p.name)+'</h4>'+p.sents.map(x=>'<div class="sr"><span class="tx" id="s_'+x.id+'">'+esc(x.text)+'</span><span class="btns"><button class="btn o sm" data-act="nextpat" data-id="'+x.id+'">🔄</button> <button class="btn s sm" data-act="drop" data-id="'+x.id+'">🗑</button></span></div>').join('')+'</div>'});
  h+='</div>';
  if(Object.keys(S.off).some(k=>S.off[k]))h+='<button class="btn s sm" data-act="restore">↩︎ 還原全部被刪走的句子</button>';
 }else if(t=='修改版'){
  h+='<div class="hint">在這裏用自己的説話改寫，長短不限。內容會自動儲存。</div><button class="btn s sm" data-act="usedraft" style="margin-bottom:6px">⬇️ 用「初稿」覆蓋這裏的文字</button> <button class="btn s sm" data-act="copy">📋 複製全文</button><textarea id="ta" data-ta="1">'+esc(S.ta)+'</textarea><div class="meter"><span id="cnt"></span><div class="bar"><i id="bar"></i></div><span id="tm"></span></div>';
 }else if(t=='計時朗讀'){
  h+='<div class="timer"><div class="chips" style="justify-content:center;margin-bottom:8px" id="durs"></div><div class="t" id="tt">00:00</div><div class="tb"><i id="tbar"></i></div><button class="btn g" data-act="startt">▶ 開始</button> <button class="btn r" data-act="stopt">■ 停止</button><div id="tmsg" style="margin-top:8px;font-size:16px;color:#475569">先揀時間，然後看着「修改版」大聲朗讀！</div></div>';
 }else if(t=='關鍵詞卡'){
  h+='<div class="hint">只看這些詞語，嘗試把整篇説出來（脱稿練習）。</div><div class="kw">'+(keywords().map(x=>'<div><small>'+esc(x[0])+'</small>'+esc(x[1])+'</div>').join('')||'<div>（先完成前面的步驟）</div>')+'</div>';
 }else{
  h+='<div class="hint">練習後逐項剔，看看還有哪些可以改善。</div><div class="chk">'+CHECK.map((c,i)=>'<label><input type="checkbox" data-chk="'+i+'" '+(S.chk[i]?'checked':'')+'>'+c+'</label>').join('')+'</div>';
 }
 h+='<div class="nav"><button class="btn s" data-act="prev">← 返回</button>'+(ui.ftab<FTABS.length-1?'<button class="btn p" data-act="next">繼續 →</button>':'<button class="btn g" data-act="print">🖨️ 列印</button>')+'</div>';
 $('card').innerHTML=h;
 if(t=='修改版')count();
 if(t=='計時朗讀'){durBtns();showT()}
}
function count(){const ta=$('ta');if(!ta)return;const t=ta.value.replace(/\s/g,'').length;$('cnt').textContent=t+' 字';
 const tg=targetChars();$('bar').style.width=(tg?Math.min(100,t/tg*100):Math.min(100,t/10))+'%';
 const sec=Math.round(t/3.8);let msg='朗讀約 '+Math.floor(sec/60)+' 分 '+(sec%60)+' 秒';
 if(tg){msg+=t<tg*0.8?'　偏短，可加細節':t>tg*1.2?'　偏長，可刪減':'　✅ 接近目標'}
 $('tm').textContent=msg;}
function durBtns(){const el=$('durs');if(!el)return;let o=[60,120,180,300];const m=Math.round(S.mins*60);if(m&&!o.includes(m))o.push(m);o.sort((a,b)=>a-b);
 const list=o.map(x=>[x,(x/60)+' 分鐘']);list.push([0,'自由計時']);
 el.innerHTML=list.map(x=>'<button class="chip'+(dur===x[0]?' sel':'')+'" data-act="setdur" data-d="'+x[0]+'">'+x[1]+'</button>').join('')}
function showT(){const t=$('tt');if(!t)return;t.textContent=dur?fmt(Math.max(dur-secs,0)):fmt(secs);$('tbar').style.width=dur?Math.min(100,secs/dur*100)+'%':'0%'}
function startT(){stopT(true);secs=0;showT();timer=setInterval(()=>{secs++;showT();if(dur&&secs>=dur){stopT(true);const m=$('tmsg');if(m)m.textContent='🎉 時間到！有沒有在時間內説完？'}},1000);const m=$('tmsg');if(m)m.textContent='開始！保持微笑、望着前方'}
function stopT(q){if(timer){clearInterval(timer);timer=null}if(!q){const m=$('tmsg');if(m)m.textContent='已停止，用了 '+fmt(secs)+'。再試一次吧！'}}
function pickV(k,v){
 const d=steps.flatMap(s=>s.qs).find(q=>q.k==k);if(!d)return;
 if(d.type=='one'){S[k]=(S[k]===v)?'':v}
 else{const a=S[k],i=a.indexOf(v);
  if(i>=0)a.splice(i,1);
  else if(a.length>=d.max){toast('最多只可以揀 '+d.max+' 個，請先點一下已選的詞語取消一個');return}
  else a.push(v)}
 render(true);
}
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act;
 if(el.tagName=='INPUT'&&a!='off')return;
 if(a=='gostep')gostep(+el.dataset.i);
 else if(a=='tab'){ui.tab=+el.dataset.i;render(true)}
 else if(a=='ftab'){ui.ftab=+el.dataset.i;render(true)}
 else if(a=='next')nextTab();
 else if(a=='prev')prevTab();
 else if(a=='pick')pickV(el.dataset.k,el.dataset.v);
 else if(a=='addown'){const inp=document.querySelector('[data-own="'+el.dataset.k+'"]');if(inp&&inp.value.trim()){pickV(el.dataset.k,inp.value.trim())}}
 else if(a=='pat'){S.pat[el.dataset.id]=+el.dataset.i;render(true)}
 else if(a=='mins'){applyMins(+el.dataset.m);dur=null;render(true)}
 else if(a=='addprof'){const n=($('pn').value||'').trim();if(!n){toast('請先輸入中學名稱');return}S.ms=n;PROF=PROF.filter(p=>p.n!==n);PROF.push({n:n,m:S.mins});saveProf();render(true);toast('已儲存「'+n+'」')}
 else if(a=='useprof'){const p=PROF[+el.dataset.i];S.ms=p.n;applyMins(p.m);dur=null;render(true)}
 else if(a=='delprof'){PROF.splice(+el.dataset.i,1);saveProf();render(true)}
 else if(a=='nextpat'){const s=sdef(el.dataset.id),c=ctx(S),n=s.pats(c).length;S.pat[s.id]=((S.pat[s.id]||0)+1)%n;const t=$('s_'+s.id);if(t)t.textContent=sentText(s,c);save()}
 else if(a=='drop'){S.off[el.dataset.id]=true;render(true)}
 else if(a=='restore'){S.off={};render(true)}
 else if(a=='usedraft'){S.ta=draft();render(true)}
 else if(a=='copy'){const ta=$('ta');if(ta){ta.select();try{document.execCommand('copy');toast('已複製')}catch(x){toast('請手動複製')}}}
 else if(a=='startt')startT();
 else if(a=='stopt')stopT();
 else if(a=='setdur'){dur=+el.dataset.d;stopT(true);secs=0;durBtns();showT()}
 else if(a=='print')window.print();
 else if(a=='reset'){if(confirm('確定要清除所有已填內容，全部重來嗎？')){try{localStorage.removeItem(KEY)}catch(x){}S=newS();applyMins(2);ui.cur=-1;ui.tab=0;ui.ftab=0;dur=null;render();window.scrollTo(0,0)}}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.act=='off'){S.off[el.dataset.id]=el.checked;render(true)}
 else if(el.dataset.act=='minsin'){const m=parseFloat(el.value);if(!isNaN(m)&&m>=0.5&&m<=10){applyMins(m);dur=null;render(true)}else toast('請輸入 0.5 至 10 之間的數字')}
 else if(el.dataset.chk!==undefined){S.chk[el.dataset.chk]=el.checked;save()}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.bind){S[el.dataset.bind]=el.value;updLive();save()}
 else if(el.dataset.bindpr){S.pr[el.dataset.bindpr]=el.value;updLive();save()}
 else if(el.dataset.ta){S.ta=el.value;count();save()}
});
document.addEventListener('keydown',e=>{
 const el=e.target;
 if(e.key=='Enter'&&el.dataset&&el.dataset.own){e.preventDefault();const v=el.value.trim();if(v)pickV(el.dataset.own,v)}
});
load();
render();
</script></body></html>
