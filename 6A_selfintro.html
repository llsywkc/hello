<header><div class="sch">勵志會梁李秀娛紀念小學</div><h1>🎤 升中面試：自我介紹練習</h1><p>跟着步驟揀一揀、想一想，右邊會即時砌出你的自我介紹。長短由你決定！</p></header>
<div class="prog" id="prog"></div>
<div class="main" id="main"><div class="card" id="card"></div><aside class="live" id="live"></aside></div>
</div>
<script>
const B='＿＿＿';
const S={name:'',school:'',style:'',mins:2,who:'',trait:[],interest:[],evType:'',evWhat:'',diff:'',act:'',res:'',lesson:'',
 gType:'',gWhere:'',gFeel:'',gLearn:'',hAct:'',hRole:'',hDo:'',hGain:'',iWho:'',iHow:'',iChange:'',
 weak:'',fix:'',fixRes:'',ms:'',reasons:[],contrib:'',pass:'',dream:'',
 pr:{trait:'',interest:'',story:'',gDetail:'',hDetail:'',iScene:'',weak:''},pat:{},off:{},ta:null,chk:{}};
/* 長度分級 */
const TIER2=['a3','b2','c3','d2','d4'];                 // 約 1.5 分鐘或以上
const MOD=['g1','g4','g2','g3','h1','h2','h3','h4','i1','i2','i3','i4'];  // 選填內容段落：2 分鐘或以上
const MODDETAIL=['g4','h4','i2','i4'];                  // 段落細節：3 分鐘或以上
const TIER3=['f1','f2'];                                // 約 2.5 分鐘或以上
function applyMins(m){
 S.mins=m;
 TIER2.forEach(id=>{S.off[id]=!(m===0||m>=1.5)});
 MOD.forEach(id=>{S.off[id]=!(m===0||m>=2)});
 MODDETAIL.forEach(id=>{S.off[id]=!(m===0||m>=3)});
 TIER3.forEach(id=>{S.off[id]=!(m===0||m>=2.5)});
}
applyMins(2);
let PROF=[];try{PROF=JSON.parse(localStorage.getItem('selfIntroProfiles')||'[]')}catch(e){}
function saveProf(){try{localStorage.setItem('selfIntroProfiles',JSON.stringify(PROF))}catch(e){}}
function addProf(){const n=($('pn').value||'').trim();if(!n)return;PROF=PROF.filter(p=>p.n!==n);PROF.push({n:n,m:S.mins});saveProf();render(true)}
function useProf(i){const p=PROF[i];S.ms=p.n;applyMins(p.m);render(true)}
function delProf(i){PROF.splice(i,1);saveProf();render(true)}
function setMins(m){applyMins(m);render(true)}
function setMinsInput(v){const m=parseFloat(v);if(!isNaN(m)&&m>=0.5&&m<=10){applyMins(m);render(true)}}
function advice(m){
 if(m===0)return '不限時間：所有段落都可以使用，揀你想講的就可以。';
 if(m<2)return '1 分鐘版本：以第 ①–④、⑧、⑩ 步為主，第 ⑤⑥⑦⑨ 步的選填段落會自動略去。';
 if(m<3)return '約 2 分鐘：建議在第 ⑤⑥⑦ 步揀 1 至 2 個選填段落（校園故事、課外活動、家庭朋友）。';
 return '約 3 分鐘或以上：建議把第 ⑤⑥⑦ 步都填寫，再加第 ⑨ 步「想讀的中學」，內容會更充實。';
}
function lenBox(){
 const pre=[[1,'1 分鐘'],[2,'2 分鐘'],[3,'3 分鐘'],[5,'5 分鐘'],[0,'不限時間']];
 const nOff=SENT.filter(s=>S.off[s.id]&&(s.pr||s.opt||TIER2.includes(s.id))).length;
 let h='<div class="lenbox"><h3>⏱️ 這間學校的面試，自我介紹有多長？</h3><div class="hint">揀了時間，系統會自動幫你開關較長或較短的句子；之後仍可逐句調整。不同學校可以分別儲存。</div><div class="chips">';
 h+=pre.map(x=>'<button class="chip '+(S.mins===x[0]?'sel':'')+'" onclick="setMins('+x[0]+')">'+x[1]+'</button>').join('');
 h+='</div><div style="margin-top:10px">或自訂：<input class="own num" type="number" step="0.5" min="0.5" max="10" value="'+(S.mins||'')+'" onchange="setMinsInput(this.value)">分鐘（0.5 至 10）</div>';
 h+='<div class="note">🎯 目標約 '+(S.mins?Math.round(S.mins*230)+' 字':'不限字數')+'（每分鐘約 230 字）。<br>📌 '+advice(S.mins)+'<br>目前有 '+nOff+' 個句子因時間設定而暫時略去。</div>';
 h+='<div style="margin-top:12px;font-weight:900;color:#1d4ed8">💾 儲存成「學校預設」</div><div class="hint">輸入學校名稱，會連同目前的時間一起儲存在這部電腦的瀏覽器裏，下次一按就套用。</div>';
 h+='<input class="own" id="pn" style="max-width:260px" placeholder="例：○○中學" value="'+S.ms+'"> <button class="btn b sm" onclick="addProf()">儲存</button>';
 if(PROF.length){h+='<div class="prof">'+PROF.map((p,i)=>'<span class="pf"><button onclick="useProf('+i+')">'+p.n+'・'+(p.m?p.m+' 分鐘':'不限')+'</button><button class="x" onclick="delProf('+i+')">✕</button></span>').join('')+'</div>'}
 else h+='<div class="hint" style="margin-top:6px">（暫時未有儲存的學校）</div>';
 return h+'</div>';
}
const COMMON={'閱讀':'很多同學都愛閱讀！試在追問寫出你最近讀的一本書，或它令你學到的一件事。','細心':'「細心」很常見，追問時寫一個你「細心」的真實例子，才有説服力。','害羞／怕生':'不少同學都選這項，重點是下一步的「改善行動」要具體。','比賽':'比賽很常見，故事裏要寫出「你自己」做了甚麼，而不只是結果。','堅持':'「堅持」是好詞語，但需要一件事來證明它。','成功完成':'結果可以多一點細節，例如「用了多久」「得到甚麼成果」。','好奇心強':'很好！追問時寫一個你曾經「追問到底」的問題。','球類運動':'試寫你最特別的一個運動時刻。'};
const OPTNOTE='📎 這是選填段落。不填就會自動略去；填了之後，會因應你在第 ① 步設定的時間而包括或略去較長的句子。';
const steps=[
{t:'① 打個招呼',w:'面試官第一眼看到你，好感從這裏開始。',ask:['想像一下：你走進面試室，第一句想怎樣開口？','你想老師覺得你是一個怎樣的人？'],custom:lenBox,qs:[
 {k:'name',type:'text',q:'你的名字？',ph:'例：陳小明'},
 {k:'school',type:'text',q:'你就讀的小學？',ph:'例：勵志會梁李秀娛紀念小學'},
 {k:'style',type:'one',q:'你想用哪種「語氣」？（影響整篇的説話味道）',hint:'揀一個最似你的',o:[['穩重','沉穩、有禮、清晰'],['活潑','開朗、有精神、親切'],['真誠','自然、像跟人聊天']]}]},
{t:'② 別人眼中的我',w:'用別人的説話介紹自己，比自己稱讚自己更有説服力。',ask:['上星期有誰稱讚過你？他説了甚麼？','如果問你的好朋友「他是怎樣的人」，他會答甚麼？'],qs:[
 {k:'who',type:'one',q:'誰最了解你？',o:['老師','同學','媽媽','爸爸','家人','朋友','班主任','教練／導師']},
 {k:'trait',type:'multi',max:3,keep:2,q:'他們會用哪些詞語形容你？（先揀 3 個，再刪走 1 個，留下最似你的 2 個）',hint:'想想：他們真的説過嗎？',o:['坐得定','好奇心強','細心','可靠','停不下來','精力充沛','樂於助人','有責任感','有創意','勤力','幽默','有禮貌','堅持','愛思考','有耐性','熱心','肯承擔','愛發問']}],
 probe:{k:'trait',q:'🔎 追問：他們在甚麼情況下這樣形容你？（寫一個小例子）',ph:'例：我每次小組討論都會提醒組員準時交功課'}},
{t:'③ 興趣與長處',w:'面試官想知道你是怎樣的人，興趣最能反映。',ask:['放學後你最想做的事是甚麼？','有甚麼事你做得特別久也不覺得悶？'],qs:[

 const T=JSON.parse(JSON.stringify(S));
 ['name','school','who','evType','diff','act','res','lesson','gType','gWhere','gFeel','gLearn','hAct','hRole','hDo','hGain','iWho','iHow','iChange','weak','fix','fixRes','contrib','pass','dream'].forEach(k=>{if(!T[k])T[k]=B});
 if(!T.evWhat&&!S.evType)T.evWhat=B;
 if(!T.trait.length)T.trait=[B];if(!T.interest.length)T.interest=[B];if(!T.reasons.length)T.reasons=[B];
 return T;
}
function sentText(s,c){const arr=s.pats(c);const i=(S.pat[s.id]||0)%arr.length;return arr[i]}
function included(s,live){
 if(S.off[s.id])return false;
 if(s.pr&&!S.pr[s.pr])return false;
 if(live||s.opt)return s.need.some(filled);
 return true;
}
function paras(live){
 const T=live?liveS():S,c=ctx(T);
 return PARA.map((nm,i)=>({name:nm,sents:SENT.filter(s=>s.p==i&&included(s,live)).map(s=>({id:s.id,text:sentText(s,c)}))}));
}
const plain=t=>t.replace(/＿/g,'').replace(/\s/g,'');
const blk=t=>t.replace(/(＿＿＿)/g,'<u class="bl">＿＿＿</u>');
const targetChars=()=>Math.round(S.mins*230);
const $=id=>document.getElementById(id);
let cur=0;
function updLive(){
 const el=$('live');if(!el)return;
 if(cur>=FINAL){el.style.display='none';$('main').className='main full';return}
 el.style.display='';$('main').className='main';
 const ps=paras(true),now=STEP2P[cur];let n=0;
 let h='<h3>📄 我的自我介紹（即時）</h3><div class="lh">你每揀一個選項或句式，這裏就即時更新。＿＿＿ 代表未揀。</div>';
 ps.forEach((p,i)=>{
  const parts=p.name.split('：');
  const tag=(parts.length>1?parts[0]+'　'+parts[1]:p.name)+(i==now?' ← 正在寫':'');
  if(p.sents.length){const t=p.sents.map(x=>x.text).join('');n+=plain(t).length;
   h+='<div class="lp '+(i==now?'now':'')+'"><small>'+tag+'</small>'+blk(t)+'</div>'}
  else if(i==now||!/選填/.test(p.name))h+='<div class="lp empty '+(i==now?'now':'')+'"><small>'+tag+'</small>（完成這一部分後，句子會出現在這裏）</div>';
 });
 h+='<div class="lcount">目前約 '+n+' 字'+(S.mins?'（目標約 '+targetChars()+' 字・'+S.mins+' 分鐘）':'（不限字數）')+'</div>';
 el.innerHTML=h;
}
function renderProg(){$('prog').innerHTML=steps.map((s,i)=>'<button class="'+(i==cur?'on':(i<cur?'done':''))+(s.opt?' opt':'')+'" onclick="go('+i+')">'+s.t.slice(0,1)+'<br><span style="font-weight:400">'+s.t.slice(2).replace('（選填）','').replace('校園生活的另一個故事','校園故事').replace('課外活動或服務經歷','課外服務').replace('家庭和朋友的影響','家庭朋友')+'</span></button>').join('')+'<button class="'+(cur==FINAL?'on':'')+'" onclick="go('+FINAL+')">✍️<br><span style="font-weight:400">修改練習</span></button>'}
function go(i){if(i>cur&&!canNext())return;cur=i;render();window.scrollTo(0,0)}
function findQ(k){for(const s of steps)for(const q of s.qs)if(q.k==k)return q}
function canNext(){if(cur>=FINAL)return true;return !steps[cur].qs.some(q=>q.type=='multi'&&S[q.k].length>q.keep)}
function pick(k,v){
 const d=findQ(k);
 if(d.type=='one'){S[k]=(S[k]===v)?'':v}
 else{const a=S[k],i=a.indexOf(v);if(i>=0)a.splice(i,1);else{if(a.length>=d.max)a.shift();a.push(v)}}
 render(true);
}
function addOwn(k,el){const v=el.value.trim();if(v)pick(k,v)}
function setPat(id,i){S.pat[id]=i;render(true)}
function toggleOff(id,v){S.off[id]=v;render(true)}
function chips(q){
 const val=S[q.k];
 let h=q.o.map(o=>{const lab=Array.isArray(o)?o[0]:o,ex=Array.isArray(o)?o[1]:'';
  const on=Array.isArray(val)?val.includes(lab):val===lab;
  return '<button class="chip '+(on?'sel':'')+'" onclick="pick(\''+q.k+'\',\''+lab+'\')">'+lab+(ex?'<span class="ex">'+ex+'</span>':'')+'</button>'}).join('');
 h+='<div style="width:100%"><input class="own" placeholder="✏️ 想自己寫？輸入後按 Enter" onkeydown="if(event.key==\'Enter\'){addOwn(\''+q.k+'\',this)}"></div>';
 return h;
}
function patSection(){
 const ids=STEPSENT[cur];if(!ids)return '';
 const c=ctx(liveS());
 let h='<div class="pats"><h3>🎨 揀句式：同一個意思，有不同的説法</h3><div class="hint">每句都有幾種寫法，點選最啱你的口吻（綠色＝已選）。覺得這句不需要，可剔「不用這句」。</div>';
 let any=false;
 ids.forEach(id=>{const s=sdef(id);
  if(s.pr&&!S.pr[s.pr])return;
  any=true;const arr=s.pats(c),sel=(S.pat[id]||0)%arr.length,off=!!S.off[id];
  h+='<div class="sent '+(off?'off':'')+'"><div class="sl"><span>📝 '+s.label+(off?'（目前時間設定下已略去，取消剔選可加入）':'')+'</span><label><input type="checkbox" '+(off?'checked':'')+' onchange="toggleOff(\''+id+'\',this.checked)"> 不用這句</label></div>';
  arr.forEach((t,i)=>{h+='<button class="pat '+(i==sel?'sel':'')+'" onclick="setPat(\''+id+'\','+i+')">'+(i+1)+'. '+blk(t)+'</button>'});
  h+='</div>'});
 if(!any)h+='<div class="hint">（寫了上面的「追問」後，就會多出一句可揀句式。）</div>';
 return h+'</div>';
}
function render(keep){
 renderProg();
 if(cur>=FINAL){renderFinal();updLive();return}
 const s=steps[cur];let h='<h2>'+s.t+'</h2><div class="why">💡 '+s.w+'</div>';
 if(s.opt)h+='<div class="optb">'+OPTNOTE+'</div>';
 h+='<div class="ask"><b>🤔 先想一想（不用寫出來）</b>'+s.ask.map(a=>'• '+a).join('<br>')+'</div>';
 if(s.custom)h+=s.custom();
 s.qs.forEach(q=>{h+='<div class="q">'+q.q+'</div>'+(q.hint?'<div class="hint">'+q.hint+'</div>':'');
  if(q.type=='text')h+='<input class="own" style="max-width:100%" value="'+S[q.k]+'" placeholder="'+q.ph+'" oninput="S[\''+q.k+'\']=this.value;updLive()" onchange="render(true)">';
  else{h+='<div class="chips">'+chips(q)+'</div>';
   if(q.type=='multi'&&S[q.k].length>q.keep)h+='<div class="warn">⚠️ 你揀了 '+S[q.k].length+' 個。請點一下已選的詞語刪走 1 個，只留下最似你的 '+q.keep+' 個。</div>';
   [].concat(S[q.k]).filter(x=>COMMON[x]).forEach(x=>{h+='<div class="uniq">🌟 「'+x+'」：'+COMMON[x]+'</div>'});}});
 if(s.probe){h+='<div class="probe"><div class="pq">'+s.probe.q+'</div><small>⭐ 寫了會令你的自我介紹更獨特，可留空</small><textarea class="pr" placeholder="'+s.probe.ph+'" oninput="S.pr[\''+s.probe.k+'\']=this.value;updLive()" onchange="render(true)">'+S.pr[s.probe.k]+'</textarea></div>'}
 h+=patSection();
 h+='<div class="nav"><button class="btn s" onclick="go('+(cur-1)+')" '+(cur==0?'style="visibility:hidden"':'')+'>← 上一步</button><button class="btn p" onclick="go('+(cur+1)+')">'+(cur==FINAL-1?'完成，去修改和練習 ✨':(s.opt?'下一步（可略過此段）→':'下一步 →'))+'</button></div>';
 const y=window.scrollY;$('card').innerHTML=h;if(keep)window.scrollTo(0,y);
 updLive();
}
function draft(){return paras(false).filter(p=>p.sents.length).map(p=>p.sents.map(x=>x.text).join('')).join('\n\n')}
function nextPat(id){const s=sdef(id),c=ctx(S),n=s.pats(c).length;S.pat[id]=((S.pat[id]||0)+1)%n;$('s_'+id).innerHTML=sentText(s,c)}
function dropS(id){S.off[id]=true;render()}
function restoreAll(){S.off={};render()}
function useDraft(){$('ta').value=draft();S.ta=$('ta').value;count()}
function keywords(){
 const k=[];
 if(S.trait.length)k.push(['他人眼中',S.trait.join('・')]);
 if(S.interest.length)k.push(['興趣',S.interest.join('・')]);
 if(S.evWhat||S.evType)k.push(['故事',S.evWhat||S.evType]);
 if(S.diff)k.push(['困難',S.diff]);
 if(S.act)k.push(['克服',S.act]);
 if(S.lesson)k.push(['體會',S.lesson]);
 if(S.gType)k.push(['校園故事',S.gType]);
 if(S.hAct)k.push(['課外活動',S.hAct]);
 if(S.iWho)k.push(['影響我的人',S.iWho]);
 if(S.weak)k.push(['缺點',S.weak]);
 if(S.fix)k.push(['改善',S.fix]);
 if(S.ms||S.reasons.length)k.push(['想讀的中學',S.ms||S.reasons.join('・')]);
 if(S.dream)k.push(['志向',S.dream]);
 return k;
}
const CHECK=['聲音夠大聲、清楚','望着「老師」，不是望地下','語速適中，沒有趕','沒有背稿的「讀書語氣」','有微笑','在自己訂的時間內完成','故事部分有加入自己的細節','結尾有停頓，並有禮貌地道謝'];
let timer=null,secs=0,dur=null;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderFinal(){
 if(S.ta===null)S.ta=draft();
 if(dur===null)dur=Math.round(S.mins*60);
 let h='<h2>✍️ 你的自我介紹初稿</h2><div class="why">💡 目前設定：'+(S.mins?S.mins+' 分鐘版本（約 '+targetChars()+' 字）':'不限時間')+(S.ms?'・'+S.ms:'')+'。每句旁邊可以按「🔄」換另一種句式，或按「🗑」刪走這句；然後在下面的修改格用自己的説話改寫。想改長短，可回到第 ① 步重設時間。</div><div class="out">';
 paras(false).forEach(p=>{if(!p.sents.length)return;
  h+='<div class="pc"><h4>'+p.name+'</h4>'+p.sents.map(x=>'<div class="sr"><span class="tx" id="s_'+x.id+'">'+x.text+'</span><span class="btns"><button class="btn o sm" onclick="nextPat(\''+x.id+'\')">🔄</button> <button class="btn s sm" onclick="dropS(\''+x.id+'\')">🗑</button></span></div>').join('')+'</div>'});
 if(Object.keys(S.off).some(k=>S.off[k]))h+='<button class="btn s sm" onclick="restoreAll()">↩︎ 還原全部被刪走的句子</button>';
 h+='</div><div class="q">📝 我的修改版（可直接修改，長短不限）</div><button class="btn s sm" onclick="useDraft()" style="margin-bottom:6px">⬇️ 用上面的初稿覆蓋修改版</button><textarea id="ta" oninput="S.ta=this.value;count()">'+S.ta+'</textarea>'
 +'<div class="meter"><span id="cnt"></span><div class="bar"><i id="bar"></i></div><span id="tm"></span></div>'
 +'<div class="sec"><h3>⏱️ 練習一：計時朗讀</h3><div class="timer"><div class="chips" style="justify-content:center;margin-bottom:8px" id="durs"></div><div class="t" id="tt">00:00</div><div class="tb"><i id="tbar"></i></div><button class="btn g" onclick="startT()">▶ 開始</button> <button class="btn r" onclick="stopT()">■ 停止</button><div id="tmsg" style="margin-top:8px;font-size:16px;color:#475569">先揀時間，然後看着修改版大聲朗讀！</div></div></div>'
 +'<div class="sec"><h3>🗝️ 練習二：關鍵詞卡（脱稿練習）</h3><div class="hint">只看這些詞語，嘗試把整篇説出來。</div><div class="kw">'+keywords().map(x=>'<div><small>'+x[0]+'</small>'+x[1]+'</div>').join('')+'</div></div>'
 +'<div class="sec"><h3>✅ 練習三：自評清單</h3><div class="chk">'+CHECK.map((t,i)=>'<label><input type="checkbox" '+(S.chk[i]?'checked':'')+' onchange="S.chk['+i+']=this.checked">'+t+'</label>').join('')+'</div></div>'
 +'<div class="tips"><b>🎯 修改小貼士</b><ul><li>用口語説出來，不要像讀書：「我覺得」比「本人認為」自然。</li><li>不同學校的面試時間不同，建議準備 1 分鐘、2 分鐘和 3 分鐘三個長度，面試時按需要增減。</li><li>朗讀 3 次：第一次看稿，第二次看關鍵詞，第三次望着「老師」説。</li></ul></div>'
 +'<div class="nav"><button class="btn s" onclick="go('+(FINAL-1)+')">← 返回修改選項</button><button class="btn g" onclick="window.print()">🖨️ 列印</button></div>';
 $('card').innerHTML=h;count();durBtns();showT();
}
function count(){const t=$('ta').value.replace(/\s/g,'').length;$('cnt').textContent=t+' 字';
 const tg=targetChars();$('bar').style.width=(tg?Math.min(100,t/tg*100):Math.min(100,t/10))+'%';
 const sec=Math.round(t/3.8);let msg='朗讀約 '+Math.floor(sec/60)+' 分 '+(sec%60)+' 秒';
 if(tg){msg+=t<tg*0.8?'　偏短，可加細節':t>tg*1.2?'　偏長，可刪減':'　✅ 接近目標'}
 $('tm').textContent=msg;}
function durBtns(){let o=[60,120,180,300];const m=Math.round(S.mins*60);if(m&&!o.includes(m))o.push(m);o.sort((a,b)=>a-b);
 const list=o.map(x=>[x,(x/60)+' 分鐘']);list.push([0,'自由計時']);
 $('durs').innerHTML=list.map(x=>'<button class="chip '+(dur===x[0]?'sel':'')+'" onclick="setDur('+x[0]+')">'+x[1]+'</button>').join('')}
function setDur(d){dur=d;stopT(true);secs=0;durBtns();showT()}
function showT(){$('tt').textContent=dur?fmt(Math.max(dur-secs,0)):fmt(secs);$('tbar').style.width=dur?Math.min(100,secs/dur*100)+'%':'0%'}
function startT(){stopT(true);secs=0;showT();timer=setInterval(()=>{secs++;showT();if(dur&&secs>=dur){stopT(true);$('tmsg').textContent='🎉 時間到！有沒有在時間內説完？'}},1000);$('tmsg').textContent='開始！保持微笑、望着前方';}
function stopT(q){if(timer){clearInterval(timer);timer=null}if(!q){$('tmsg').textContent='已停止，用了 '+fmt(secs)+'。再試一次吧！'}}
render();
</script></body></html>
