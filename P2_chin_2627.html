<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小二 T1FA2 温習</title><style>*{box-sizing:border-box}body{margin:0;background:#fff1a0;color:#14213d;font:800 22px/1.8 Arial,"Microsoft JhengHei",sans-serif}header{background:#352080;color:#fff;text-align:center;padding:20px;border-bottom:8px solid #ff9d00}h1{font-size:clamp(28px,6vw,42px);margin:0}main{max-width:1000px;margin:auto;padding:18px}button,input{font:900 22px/1.5 Arial,"Microsoft JhengHei",sans-serif}button{cursor:pointer;background:#d0f9ff;color:#14213d;border:3px solid #14213d;border-radius:15px;padding:12px 18px;min-height:58px;box-shadow:0 4px #14213d}button:hover{background:#ffe78a}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible{outline:5px solid #d00070;outline-offset:3px}.bar,.actions{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.bar button{flex:1;min-width:160px}.active,.primary{background:#352080;color:#fff}.card{background:#fff;border:4px solid #352080;border-radius:24px;padding:24px;margin:20px 0;box-shadow:6px 6px #ff9d00}.question{font-size:28px;line-height:2}.stats{background:#14213d;color:#fff;padding:12px;border-radius:12px}progress{width:100%;height:24px;accent-color:#6020cb}input{width:110px;border:3px solid #352080;background:#fff4b0;border-radius:10px;text-align:center;padding:8px;margin:4px}#built{min-height:100px;border:3px dashed #6020cb;background:#f4edff;padding:12px;border-radius:14px}#built button{margin:5px}.punct{background:#ffdf83}.feedback{padding:12px;margin-top:16px;border-radius:12px}.good{background:#cbffda;color:#075125}.bad{background:#ffe0e7;color:#92002b}.small{font-size:17px}details{background:#d5faff;padding:12px;border-radius:12px}summary{cursor:pointer}.tip{background:#ffec96;padding:12px;border-radius:12px}

@media(max-width:700px){main{padding:10px}.card{padding:15px}.bar button{flex-basis:40%;min-width:120px;font-size:18px}.question{font-size:24px}.mrow{grid-template-columns:1fr}.mitem{min-height:64px;font-size:19px}}</style><header><h1>🌈 小二 T1FA2 温習</h1><div>詞語、填充、重組、配對：全部隨機出題</div></header><main><nav id="nav" class="bar"></nav><div id="stats" class="stats"></div><progress id="progress" max="35" value="0" aria-label="完成進度"></progress><section id="play" class="card"></section><section class="card"><details><summary>📖 查看／收起第六課課文</summary><p>我本來想為大家服務，可是忘記了不同的動物有不同的要求，結果大家都不滿意。</p></details></section><div class="actions"><button id="restart">🔀 本關重新洗牌</button><button id="reset">🔄 全部重新開始</button></div><p class="small">詞語選擇、填充及「得」句式配對的題目次序，每次開始或按「本關重新洗牌」都會隨機排列，同一輪不重複。配對玩法：① 點左邊句子（變紫色）→ ② 點右邊短語；配好後兩邊變綠色。點左邊已配對句子可更改。完成 20 對後按「✓ 檢查配對」。首次答對／全對得星星。重新整理頁面會清除成績。</p></main><script>
const Q=[{"type": "mc", "text": "巴士開動了，請大家＿＿好，不要站起來。", "a": "坐", "opts": ["坐", "跑", "跳"]}, {"type": "mc", "text": "爺爺，這裏有椅子，請＿＿下來休息。", "a": "坐", "opts": ["坐", "飛", "爬"]}, {"type": "mc", "text": "上課時，同學們＿＿在椅子上，專心聽老師說話。", "a": "坐", "opts": ["坐", "游", "跑"]}, {"type": "mc", "text": "＿＿每天練習，你就能把字寫得更好。", "a": "只要", "opts": ["只要", "可是", "已經"]}, {"type": "mc", "text": "＿＿你願意幫忙，我就很開心了。", "a": "只要", "opts": ["只要", "所以", "後來"]}, {"type": "mc", "text": "＿＿按一下這個按鈕，玩具車就會向前走。", "a": "只要", "opts": ["只要", "但是", "因為"]}, {"type": "mc", "text": "小明忘了帶雨傘，＿＿全身都被雨淋濕了。", "a": "結果", "opts": ["結果", "味道", "最近"]}, {"type": "mc", "text": "比賽結束了，老師向大家公布比賽的＿＿。", "a": "結果", "opts": ["結果", "要求", "味道"]}, {"type": "mc", "text": "妹妹跑得太快，＿＿跌了一跤。", "a": "結果", "opts": ["結果", "只要", "尊重"]}, {"type": "mc", "text": "媽媽叫我用鼻子＿＿一聞，看看牛奶有沒有變壞。", "a": "聞", "opts": ["聞", "看", "聽"]}, {"type": "mc", "text": "我還沒走進廚房，就＿＿到飯菜的香味。", "a": "聞", "opts": ["聞", "摸", "看"]}, {"type": "mc", "text": "小狗低着頭，用鼻子＿＿地上的東西。", "a": "聞", "opts": ["聞", "寫", "聽"]}, {"type": "mc", "text": "老師＿＿我們上課前把課本放在桌上。", "a": "要求", "opts": ["要求", "味道", "最近"]}, {"type": "mc", "text": "弟弟＿＿媽媽再講一個故事，媽媽答應了。", "a": "要求", "opts": ["要求", "結果", "只要"]}, {"type": "mc", "text": "做這份功課時，我們要按照老師的＿＿，用鉛筆作答。", "a": "要求", "opts": ["要求", "味道", "最近"]}, {"type": "mc", "text": "這碗湯的＿＿很好，我想再喝一碗。", "a": "味道", "opts": ["味道", "結果", "要求"]}, {"type": "mc", "text": "這顆糖有草莓的＿＿，甜甜的。", "a": "味道", "opts": ["味道", "尊重", "最近"]}, {"type": "mc", "text": "我不喜歡苦瓜的＿＿，因為它太苦了。", "a": "味道", "opts": ["味道", "要求", "結果"]}, {"type": "mc", "text": "別人說話時，我們應該用心聆聽，＿＿別人。", "a": "尊重", "opts": ["尊重", "取笑", "打斷"]}, {"type": "mc", "text": "每個人的喜好都不同，我們要＿＿別人的選擇。", "a": "尊重", "opts": ["尊重", "聞", "坐"]}, {"type": "mc", "text": "不隨便拿走同學的東西，是＿＿別人的表現。", "a": "尊重", "opts": ["尊重", "味道", "最近"]}, {"type": "mc", "text": "＿＿幾天，天氣變冷了，大家要多穿一件衣服。", "a": "最近", "opts": ["最近", "結果", "要求"]}, {"type": "mc", "text": "我＿＿開始學游泳，到現在只上了兩節課。", "a": "最近", "opts": ["最近", "味道", "尊重"]}, {"type": "mc", "text": "爸爸＿＿工作很忙，這幾天都很晚才回家。", "a": "最近", "opts": ["最近", "只要", "結果"]}, {"type": "order", "text": "依照原文，排列詞語及標點符號。", "a": ["我", "本來想", "為大家", "服務", "，"]}, {"type": "order", "text": "依照原文，排列詞語及標點符號。", "a": ["可是", "忘記了"]}, {"type": "order", "text": "依照原文，排列詞語及標點符號。", "a": ["不同的動物", "有", "不同的要求", "，"]}, {"type": "order", "text": "依照原文，排列詞語及標點符號。", "a": ["結果", "大家", "都", "不滿意", "。"]}, {"type": "order", "text": "依照原文，排列詞語及標點符號。", "a": ["我本來想為大家服務", "，", "可是忘記了", "不同的動物有不同的要求", "，", "結果大家都不滿意", "。"]}, {"type": "fill", "text": "我｜想為大家｜，可是忘記了不同的動物有不同的要求，結果大家都不滿意。", "a": ["本來", "服務"]}, {"type": "fill", "text": "我本來想為大家服務，｜｜了不同的動物有不同的要求，結果大家都不滿意。", "a": ["可是", "忘記"]}, {"type": "fill", "text": "我本來想為大家服務，可是忘記了｜的｜有不同的要求，結果大家都不滿意。", "a": ["不同", "動物"]}, {"type": "fill", "text": "我本來想為大家服務，可是忘記了不同的動物有不同的｜，｜大家都不滿意。", "a": ["要求", "結果"]}, {"type": "fill", "text": "我本來想為大家服務，可是忘記了不同的動物有不同的要求，結果｜都不｜。", "a": ["大家", "滿意"]}, {"type": "match", "text": "把左邊的句子和右邊最合適的「得」短語配對。", "pairs": [["青蛙一跳就跳到高高的石頭上", "跳得高"], ["小鳥一下子就飛到大樹上", "飛得高"], ["小狗一下子就追上了皮球", "跑得快"], ["烏龜走了很久才走到門口", "走得慢"], ["妹妹吃了很久，碗裏還有很多飯", "吃得慢"], ["哥哥很快就把飯吃完了", "吃得快"], ["媽媽聽得很清楚", "說得大聲"], ["寶寶睡着了", "說得小聲"], ["妹妹的歌聲很好聽", "唱得動聽"], ["這個笑話真有趣", "笑得很開心"], ["弟弟找不到媽媽", "急得哭了起來"], ["我跑了十圈", "累得滿頭大汗"], ["天氣很冷", "凍得直發抖"], ["小明上課專心", "做得很認真"], ["妹妹把每個字都寫在格子中間", "寫得很工整"], ["姐姐把地板掃得一點垃圾也沒有", "掃得乾乾淨淨"], ["弟弟把書本排得整整齊齊", "排得整整齊齊"], ["小魚一下子就游到池塘另一邊", "游得快"], ["妹妹拍皮球，拍了一百下也沒有停", "拍得多"], ["爸爸一碰到枕頭就睡着了", "睡得快"]]}],$=s=>document.querySelector(s),modes=[['全部闖關','all'],['詞語選擇 24 題','mc'],['重組句子 5 題','order'],['隨機填充 5 題','fill'],['「得」句式配對','match']];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mix(a,old){let b;do{b=shuffle(a)}while(b.every((v,i)=>v===a[i])||(old&&b.every((v,i)=>v===old[i])));return b}
const mcBase=Array.from({length:24},(_,i)=>i),fillBase=[29,30,31,32,33],matchBase=34;let mc=mix(mcBase),fill=mix(fillBase),mode='match',index=0,selected=[],bank=[],L=[],R=[],matches={},sel=null,state=Q.map(()=>({done:false,tried:false,star:false}));
function ids(){return mode==='all'?[...mc,...fill,matchBase]:mode==='mc'?mc:mode==='fill'?fill:mode==='match'?[matchBase]:Q.map((q,i)=>i).filter(i=>Q[i].type===mode)}
function stats(){$('#stats').textContent=`第 ${index+1} / ${ids().length} 題　⭐ ${state.filter(s=>s.star).length} 粒星　✅ ${state.filter(s=>s.done).length} / 35${mode==='match'||mode==='all'?'　配對：'+Object.keys(matches).length+' / 20':''}`;$('#progress').value=state.filter(s=>s.done).length}
function draw(){selected=[];sel=null;matches={};let id=ids()[index],q=Q[id];$('#nav').innerHTML=modes.map(([n,k])=>`<button data-mode="${k}" class="${k===mode?'active':''}">${n}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;draw()});stats();let h=`<div class="small">${modes.find(m=>m[1]===q.type)[0]}${state[id].done?'　✅ 已完成':''}</div>`;
if(q.type==='match'){L=shuffle(q.pairs.map((p,i)=>i));R=shuffle(q.pairs.map((p,i)=>i));h+='<div class="tip">💡 ① 點左邊句子 → ② 點右邊短語。配好後兩邊會變綠色，並顯示相同號碼。</div><div class="mrow"><div class="mcol" id="L"></div><div class="mcol" id="R"></div></div><div class="actions"><button id="check" class="primary">✓ 檢查配對</button><button id="clear">↩️ 清除全部配對</button></div>'}
if(q.type==='fill'){h+='<p class="small">每格填兩個中文字。</p><div class="question">';q.text.split('｜').forEach((p,i)=>{h+=p;if(i<q.a.length)h+=`<input maxlength="2" aria-label="第${i+1}格" autocomplete="off" data-input="${i}">`});h+='</div>'}else h+=`<p class="question">${q.text}</p>`;
if(id===25)h+='<p class="small">這是原文中間片段：「可是忘記了」後面接下文，不另加標點。</p>';
if(q.opts)h+='<div class="choices">'+shuffle(q.opts).map(a=>`<button data-answer="${a}">${a}</button>`).join('')+'</div>';
if(q.type==='order'){bank=shuffle(q.a);h+='<div id="built">👇 請點選詞語及標點</div><div class="choices">'+bank.map((w,i)=>`<button data-word="${i}" class="${/[，。]/.test(w)?'punct':''}">${w}</button>`).join('')+'</div><button id="clear">↩️ 清除排序</button>'}
h+='<div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions">';if(q.type!=='match')h+='<button id="check" class="primary">✓ 檢查答案</button>';h+=`<button id="prev" ${index===0?'disabled':''}>← 上一題</button><button id="next">${index===ids().length-1?'🏁 查看成績':'下一題 →'}</button></div>`;$('#play').innerHTML=h;
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>check(b.dataset.answer===q.a,id));if(q.type==='order'){document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selected.push(+b.dataset.word);render()});$('#clear').onclick=()=>{selected=[];render()}}
if($('#check'))$('#check').onclick=()=>check(q.type==='order'?selected.map(i=>bank[i]).join('')===q.a.join(''):q.a.every((a,i)=>$(`[data-input="${i}"]`).value.trim()===a),id);$('#prev').onclick=()=>{index--;draw()};$('#next').onclick=()=>{if(index<ids().length-1){index++;draw()}else summary()};if(q.type==='match')renderMatch()}
function renderMatch(){const q=Q[matchBase];$('#L').innerHTML=L.map((pi,n)=>{const m=matches[pi],s=sel===pi;return `<button class="mitem ${m!==undefined?'done':''} ${s?'sel':''}" data-left="${pi}"><span class="badge">${n+1}</span><span>${q.pairs[pi][0]}<br><span class="pairline">${m!==undefined?'已配對 → '+q.pairs[m][1]:(s?'已選擇，請點右邊短語':'未配對')}</span></span></button>`}).join('');
$('#R').innerHTML=R.map((pi,n)=>{const used=Object.values(matches).includes(pi);return `<button class="mitem ${used?'done':''}" data-right="${pi}" ${used?'disabled':''}><span class="badge">${String.fromCharCode(65+n)}</span><span>${q.pairs[pi][1]}</span></button>`}).join('');
document.querySelectorAll('[data-left]').forEach(b=>b.onclick=()=>{const i=+b.dataset.left;if(matches[i]!==undefined)delete matches[i];sel=sel===i?null:i;renderMatch();stats()});document.querySelectorAll('[data-right]').forEach(b=>b.onclick=()=>{if(sel===null)return alert('請先點選左邊一個句子！');matches[sel]=+b.dataset.right;sel=null;renderMatch();stats()});$('#clear').onclick=()=>{matches={};sel=null;renderMatch();stats()};$('#check').onclick=()=>{if(Object.keys(matches).length<20)return check(false,matchBase,true);check(q.pairs.every((p,i)=>q.pairs[matches[i]]&&q.pairs[matches[i]][1]===p[1]),matchBase)}}
function render(){$('#built').innerHTML=selected.length?selected.map((n,i)=>`<button data-remove="${i}">${bank[n]} ×</button>`).join(''):'👇 請點選詞語及標點';document.querySelectorAll('[data-word]').forEach(b=>b.disabled=selected.includes(+b.dataset.word));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.splice(+b.dataset.remove,1);render()})}
function check(ok,id,partial){let s=state[id],q=Q[id];if(!s.done){if(ok){s.done=true;s.star=!s.tried}else s.tried=true}let f=$('#feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'🎉 '+(q.type==='match'?'全部配對正確！你真棒！':'答對了！真棒！')+(q.type==='de'?' '+q.text.replace('＿＿',q.a):q.type==='order'?' '+q.a.join(''):''):'💪 再試一次！'+(partial?'請先完成全部 20 對配對。':q.type==='match'?'有些配對不正確。點左邊句子可更改配對。':q.type==='order'?'留意詞語次序和標點位置。':'仔細讀一讀。');stats()}
function summary(){let l=ids(),n=l.filter(i=>state[i].done).length,s=l.filter(i=>state[i].star).length;$('#play').innerHTML=`<h2>🎉 練習成績</h2><p>本關完成：${n} / ${l.length} 題</p><p>首次答對：⭐ ${s} / ${l.length} 題</p><p>${n===l.length?'完成本關了！你真努力！':'慢慢來，你做得到！'}</p><div class="actions"><button id="back">📚 返回題目</button><button id="todo">💪 練未完成題目</button></div>`;$('#back').onclick=()=>{index=0;draw()};$('#todo').onclick=()=>{index=Math.max(0,l.findIndex(i=>!state[i].done));draw()}}
$('#restart').onclick=()=>{if(confirm('清除本關成績並重新洗牌？')){ids().forEach(i=>state[i]={done:false,tried:false,star:false});if(mode==='mc'||mode==='all')mc=mix(mcBase,mc);if(mode==='fill'||mode==='all')fill=mix(fillBase,fill);index=0;draw()}};$('#reset').onclick=()=>{if(confirm('清除全部成績並重新洗牌？')){state=Q.map(()=>({done:false,tried:false,star:false}));mc=mix(mcBase,mc);fill=mix(fillBase,fill);index=0;draw()}};draw();</script></html>
