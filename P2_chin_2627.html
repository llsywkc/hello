<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小二 T1FA2 温習</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff4ab;color:#14213d;font-family:Arial,"Microsoft JhengHei",sans-serif;font-weight:800;font-size:21px;line-height:1.7}header{background:#352080;color:white;padding:20px;text-align:center;border-bottom:8px solid #ffab00}h1{font-size:clamp(28px,6vw,42px);margin:0}main{max-width:950px;margin:auto;padding:18px}button,input{font:inherit;font-weight:900}button{cursor:pointer;border:3px solid #14213d;border-radius:16px;padding:12px 20px;background:#fff;color:#14213d;min-height:56px;box-shadow:0 4px 0 #14213d}button:hover{background:#fff0a0}button:focus-visible,input:focus-visible{outline:5px solid #d00070;outline-offset:3px}button:disabled{cursor:default;opacity:.65}nav,.actions,.choices{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}nav button{flex:1;background:#c8f6ff}nav button.active{background:#352080;color:white}.card{background:white;border:4px solid #352080;border-radius:24px;padding:24px;margin:20px 0;box-shadow:7px 7px 0 #ff9e00}.question{font-size:clamp(25px,4.5vw,34px);line-height:1.9}.choices button{flex:1;min-width:125px;background:#d8fbff}.primary{background:#352080;color:#fff}.primary:hover{background:#542db7}.correct{background:#d1ffdc!important;border-color:#09652b!important}.wrong{background:#ffe0e7!important;border-color:#ae0030!important}.feedback{padding:12px;border-radius:12px;min-height:55px}.good{background:#d1ffdc;color:#095027}.bad{background:#ffe0e7;color:#950029}.small{font-size:17px}.stats{background:#14213d;color:#fff;padding:12px;border-radius:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}progress{width:100%;height:22px;accent-color:#6b24d1}input{width:110px;max-width:100%;border:3px solid #352080;border-radius:10px;padding:6px;text-align:center;background:#fff6b3;margin:5px}#built{min-height:90px;border:3px dashed #352080;background:#f4eeff;padding:12px;border-radius:14px}#built button{margin:5px;font-size:20px}details{background:#e4faff;padding:12px;border-radius:14px}summary{cursor:pointer}footer{text-align:center;font-size:16px;padding:20px} .hidden{display:none!important}@media(max-width:500px){main{padding:10px}.card{padding:16px}nav button{flex-basis:40%;font-size:18px;padding:10px}.choices button{flex-basis:100%}}
</style></head><body><header><h1>🌈 小二 T1FA2 温習</h1><div>讀一讀・想一想・開心闖關！</div></header><main><nav id="nav"></nav><div class="stats"><span id="position"></span><span id="score"></span></div><progress id="progress" value="0" max="34" aria-label="完成進度"></progress><section class="card" id="play"></section><section class="card"><details><summary>📖 查看／收起第六課課文</summary><p>我本來想為大家服務，可是忘記了不同的動物有不同的要求，結果大家都不滿意。</p><p class="small">先讀熟，再收起課文試做填充題。</p></details></section><div class="actions"><button id="restart">🔄 重新開始本關</button><button id="allreset">🧹 全部重新開始</button></div><p class="small">玩法：選擇題點答案；重組句點詞語排序（點已選詞語可移除）；填充題輸入兩個中文字。每題首次答對得一粒星，答錯可再試，完成後仍可翻看題目。重組句已提供標點答案，不另計標點分。</p></main><footer>⭐ 每次練習，都是進步！無需登入・沒有倒數計時</footer><script>
const questions=[{"type": "mc", "text": "巴士開動了，請大家＿＿好，不要站起來。", "options": ["跑", "坐", "跳"], "answers": ["坐"]}, {"type": "mc", "text": "爺爺，這裏有椅子，請＿＿下來休息。", "options": ["坐", "飛", "爬"], "answers": ["坐"]}, {"type": "mc", "text": "上課時，同學們＿＿在椅子上，專心聽老師說話。", "options": ["游", "跑", "坐"], "answers": ["坐"]}, {"type": "mc", "text": "＿＿每天練習，你就能把字寫得更好。", "options": ["可是", "只要", "已經"], "answers": ["只要"]}, {"type": "mc", "text": "＿＿你願意幫忙，我就很開心了。", "options": ["只要", "所以", "後來"], "answers": ["只要"]}, {"type": "mc", "text": "＿＿按一下這個按鈕，玩具車就會向前走。", "options": ["但是", "因為", "只要"], "answers": ["只要"]}, {"type": "mc", "text": "小明忘了帶雨傘，＿＿全身都被雨淋濕了。", "options": ["味道", "結果", "最近"], "answers": ["結果"]}, {"type": "mc", "text": "比賽結束了，老師向大家公布比賽的＿＿。", "options": ["結果", "要求", "味道"], "answers": ["結果"]}, {"type": "mc", "text": "妹妹跑得太快，＿＿跌了一跤。", "options": ["只要", "尊重", "結果"], "answers": ["結果"]}, {"type": "mc", "text": "媽媽叫我用鼻子＿＿一聞，看看牛奶有沒有變壞。", "options": ["看", "聞", "聽"], "answers": ["聞"]}, {"type": "mc", "text": "我還沒走進廚房，就＿＿到飯菜的香味。", "options": ["聞", "摸", "看"], "answers": ["聞"]}, {"type": "mc", "text": "小狗低着頭，用鼻子＿＿地上的東西。", "options": ["寫", "聽", "聞"], "answers": ["聞"]}, {"type": "mc", "text": "老師＿＿我們上課前把課本放在桌上。", "options": ["味道", "要求", "最近"], "answers": ["要求"]}, {"type": "mc", "text": "弟弟＿＿媽媽再講一個故事，媽媽答應了。", "options": ["要求", "結果", "只要"], "answers": ["要求"]}, {"type": "mc", "text": "做這份功課時，我們要按照老師的＿＿，用鉛筆作答。", "options": ["味道", "最近", "要求"], "answers": ["要求"]}, {"type": "mc", "text": "這碗湯的＿＿很好，我想再喝一碗。", "options": ["結果", "味道", "要求"], "answers": ["味道"]}, {"type": "mc", "text": "這顆糖有草莓的＿＿，甜甜的。", "options": ["味道", "尊重", "最近"], "answers": ["味道"]}, {"type": "mc", "text": "我不喜歡苦瓜的＿＿，因為它太苦了。", "options": ["要求", "結果", "味道"], "answers": ["味道"]}, {"type": "mc", "text": "別人說話時，我們應該用心聆聽，＿＿別人。", "options": ["取笑", "尊重", "打斷"], "answers": ["尊重"]}, {"type": "mc", "text": "每個人的喜好都不同，我們要＿＿別人的選擇。", "options": ["尊重", "聞", "坐"], "answers": ["尊重"]}, {"type": "mc", "text": "不隨便拿走同學的東西，是＿＿別人的表現。", "options": ["味道", "最近", "尊重"], "answers": ["尊重"]}, {"type": "mc", "text": "＿＿幾天，天氣變冷了，大家要多穿一件衣服。", "options": ["結果", "最近", "要求"], "answers": ["最近"]}, {"type": "mc", "text": "我＿＿開始學游泳，到現在只上了兩節課。", "options": ["最近", "味道", "尊重"], "answers": ["最近"]}, {"type": "mc", "text": "爸爸＿＿工作很忙，這幾天都很晚才回家。", "options": ["只要", "結果", "最近"], "answers": ["最近"]}, {"type": "order", "text": "按正確次序點選詞語，組成句子。", "options": ["為大家", "我", "服務", "本來想"], "answers": ["我", "本來想", "為大家", "服務"], "note": ""}, {"type": "order", "text": "按正確次序點選詞語，組成句子。", "options": ["忘記了", "可是", "我"], "answers": ["可是", "我", "忘記了"], "note": "這題是獨立練習句，多了「我」字；背默請以原文為準。"}, {"type": "order", "text": "按正確次序點選詞語，組成句子。", "options": ["有", "不同的要求", "不同的動物"], "answers": ["不同的動物", "有", "不同的要求"], "note": ""}, {"type": "order", "text": "按正確次序點選詞語，組成句子。", "options": ["都", "結果", "不滿意", "大家"], "answers": ["結果", "大家", "都", "不滿意"], "note": ""}, {"type": "order", "text": "按正確次序點選詞語，組成句子。", "options": ["可是忘記了", "結果大家都不滿意", "我本來想為大家服務", "不同的動物有不同的要求"], "answers": ["我本來想為大家服務", "可是忘記了", "不同的動物有不同的要求", "結果大家都不滿意"], "note": ""}, {"type": "fill", "text": "我｜想為大家｜，可是忘記了不同的動物有不同的要求，結果大家都不滿意。", "answers": ["本來", "服務"]}, {"type": "fill", "text": "我本來想為大家服務，｜｜了不同的動物有不同的要求，結果大家都不滿意。", "answers": ["可是", "忘記"]}, {"type": "fill", "text": "我本來想為大家服務，可是忘記了｜的｜有不同的要求，結果大家都不滿意。", "answers": ["不同", "動物"]}, {"type": "fill", "text": "我本來想為大家服務，可是忘記了不同的動物有不同的｜，｜大家都不滿意。", "answers": ["要求", "結果"]}, {"type": "fill", "text": "我本來想為大家服務，可是忘記了不同的動物有不同的要求，結果｜都不｜。", "answers": ["大家", "滿意"]}];
const modes=[['全部闖關','all'],['詞語選擇 24 題','mc'],['重組句子 5 題','order'],['課文填充 5 題','fill']];
let mode='all',index=0,selected=[],states=questions.map(()=>({done:false,tried:false,star:false}));
const $=s=>document.querySelector(s);const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ids(){return questions.map((q,i)=>i).filter(i=>mode==='all'||questions[i].type===mode)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function draw(){selected=[];const list=ids(),id=list[index],q=questions[id],s=states[id];$('#nav').innerHTML=modes.map(([name,key])=>`<button class="${key===mode?'active':''}" data-mode="${key}">${name}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;draw()});$('#position').textContent=`第 ${index+1} / ${list.length} 題`;$('#score').textContent=`⭐ ${states.filter(x=>x.star).length} 粒星　✅ ${states.filter(x=>x.done).length} / 34`;$('#progress').value=states.filter(x=>x.done).length;
let body=`<div class="small">${q.type==='mc'?'🍎 詞語選擇':q.type==='order'?'🧩 重組句子':'✏️ 課文填充'}${s.done?'　✅ 已完成':''}</div>`;
if(q.type==='fill'){body+='<p class="small">每格填兩個中文字；可以用中文鍵盤輸入。</p><div class="question">';q.text.split('｜').forEach((part,i)=>{body+=esc(part);if(i<q.answers.length)body+=`<input aria-label="第${i+1}格" maxlength="2" autocomplete="off" data-input="${i}">`});body+='</div>'}else body+=`<p class="question">${esc(q.text)}</p>`;
if(q.note)body+=`<p class="small">提示：${esc(q.note)}</p>`;
if(q.type==='mc')body+='<div class="choices">'+shuffle(q.options).map(o=>`<button data-answer="${o}">${o}</button>`).join('')+'</div>';
if(q.type==='order')body+='<div id="built" aria-label="你的句子">👇 點選下面的詞語</div><div class="choices" id="bank">'+q.options.map((o,i)=>`<button data-word="${i}">${o}</button>`).join('')+'</div><button id="clear">↩️ 清除排序</button>';
body+='<div id="feedback" class="feedback" role="status" aria-live="polite"></div><div class="actions">';if(q.type!=='mc')body+='<button class="primary" id="check">✓ 檢查答案</button>';body+=`<button id="prev" ${index===0?'disabled':''}>← 上一題</button><button id="next">${index===list.length-1?'🏁 查看成績':'下一題 →'}</button></div>`;$('#play').innerHTML=body;
document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const ok=b.dataset.answer===q.answers[0];b.classList.add(ok?'correct':'wrong');check(ok,id)});
if(q.type==='order'){document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{selected.push(Number(b.dataset.word));renderWords(q)});$('#clear').onclick=()=>{selected=[];renderWords(q)}}
if($('#check'))$('#check').onclick=()=>{let ok;if(q.type==='fill')ok=q.answers.every((a,i)=>document.querySelector(`[data-input="${i}"]`).value.trim()===a);else ok=selected.map(i=>q.options[i]).join('')===q.answers.join('');check(ok,id)};
$('#prev').onclick=()=>{index--;draw()};$('#next').onclick=()=>{if(index<list.length-1){index++;draw()}else summary()};}
function renderWords(q){$('#built').innerHTML=selected.length?selected.map((n,i)=>`<button data-remove="${i}">${q.options[n]} ×</button>`).join(''):'👇 點選下面的詞語';document.querySelectorAll('[data-word]').forEach(b=>b.disabled=selected.includes(Number(b.dataset.word)));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selected.splice(Number(b.dataset.remove),1);renderWords(q)})}
function check(ok,id){const s=states[id],q=questions[id];if(!s.done){if(ok){s.star=!s.tried;s.done=true}else s.tried=true}const f=$('#feedback');f.className='feedback '+(ok?'good':'bad');f.textContent=ok?'✅ 答對了！做得好！'+(q.type==='order'?' 正確句子：'+(id===28?'我本來想為大家服務，可是忘記了不同的動物有不同的要求，結果大家都不滿意。':q.answers.join('')+'。'):''):'💪 再試一次！'+(q.type==='fill'?'記住每格要填兩個字。':'仔細讀一讀題目。');$('#score').textContent=`⭐ ${states.filter(x=>x.star).length} 粒星　✅ ${states.filter(x=>x.done).length} / 34`;$('#progress').value=states.filter(x=>x.done).length}
function summary(){const list=ids(),done=list.filter(i=>states[i].done).length,stars=list.filter(i=>states[i].star).length;$('#play').innerHTML=`<h2>🎉 練習成績</h2><p>本關完成：${done} / ${list.length} 題</p><p>首次答對：⭐ ${stars} / ${list.length} 題</p><p>${done===list.length?'你完成了本關！真努力！':'還有未完成的題目，慢慢來，你做得到！'}</p><div class="actions"><button id="review">📚 返回題目</button><button id="unfinished">💪 練未完成題目</button></div>`;$('#review').onclick=()=>{index=0;draw()};$('#unfinished').onclick=()=>{const n=list.findIndex(i=>!states[i].done);index=n<0?0:n;draw()}}
$('#restart').onclick=()=>{if(confirm('要清除本關成績，重新開始嗎？')){ids().forEach(i=>states[i]={done:false,tried:false,star:false});index=0;draw()}};
$('#allreset').onclick=()=>{if(confirm('要清除全部 34 題的成績嗎？')){states=questions.map(()=>({done:false,tried:false,star:false}));index=0;draw()}};draw();
</script></body></html>
